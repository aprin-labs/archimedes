<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#F2F1E8" />
    <meta name="robots" content="noindex,nofollow" />
    <meta
      name="description"
      content="An interactive Archimedes research concept. Explore hypotheses, simulated strategies and their evidence. All data is fictional."
    />
    <link rel="icon" type="image/svg+xml" href="/brand/fulcro-symbol.svg" />
    <title>Archimedes | Research Observatory</title>
    <link rel="stylesheet" href="/theme.css" />
    <script>
      // Same preview-only key as App. Resolve before the React bundle or first paint.
      (() => {
        let preference = "system";
        try {
          const stored = localStorage.getItem(
            "archimedes.observatory.appearance",
          );
          if (["light", "dark", "system"].includes(stored)) preference = stored;
        } catch {
          /* Restricted storage: follow the system for this visit. */
        }
        const root = document.documentElement;
        root.dataset.appearance = preference;
        root.dataset.theme =
          preference === "system"
            ? matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : preference;
        root.style.colorScheme = root.dataset.theme;
        document.querySelector('meta[name="theme-color"]').content =
          getComputedStyle(root).getPropertyValue("--canvas").trim();
      })();
    </script>
    <link
      rel="preload"
      href="/fonts/dm-sans-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript
      >This interactive demonstration needs JavaScript. No investment orders or
      live research are performed.</noscript
    >
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
