<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Archimedes | Research-grounded portfolio strategies</title>
    <meta
      name="description"
      content="Describe a portfolio goal. Archimedes generates a research-grounded strategy, tests it for selection bias against a rigor gate, and lets you inspect the evidence. Running on Arc public testnet."
    />
    <link
      rel="preload"
      href="/fonts/gabarito-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- Plain fallback first (browsers without media support read it; the
         media-scoped pair below wins where supported). Matches the manifest. -->
    <meta name="theme-color" content="#15131D" />
    <meta
      name="theme-color"
      content="#EFEDFF"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#15131D"
      media="(prefers-color-scheme: dark)"
    />

    <meta
      property="og:title"
      content="Archimedes | Research-grounded portfolio strategies"
    />
    <meta
      property="og:description"
      content="Generate a cited strategy, see exactly why it passes or fails, and read the evidence underneath the verdict."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://archimedes-arc.com/" />
    <meta property="og:site_name" content="Archimedes" />
    <meta
      property="og:image"
      content="https://archimedes-arc.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Archimedes strategy generation workspace showing a research brief and visible rigor pipeline."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Archimedes | Research-grounded portfolio strategies"
    />
    <meta
      name="twitter:description"
      content="Generate a cited strategy, inspect the rigor verdict, and read the evidence underneath. Generation is not anchored on-chain."
    />
    <meta
      name="twitter:image"
      content="https://archimedes-arc.com/og-image.png"
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("archimedes.theme");
          var systemDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;
          var theme = stored;
          if (theme !== "dark" && theme !== "light") {
            theme = systemDark ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", theme);
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Archimedes",
        "applicationCategory": "FinanceApplication",
        "description": "A research-grounded strategy-generation instrument with visible selection-bias checks on Arc public testnet. Generation is not anchored on-chain.",
        "url": "https://archimedes-arc.com/",
        "operatingSystem": "Web",
        "potentialAction": {
          "@type": "CreateAction",
          "name": "Generate a strategy",
          "target": "https://archimedes-arc.com/app/generate"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
