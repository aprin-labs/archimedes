<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="720" viewBox="0 0 1240 720" role="img" aria-labelledby="fd-title fd-desc">
  <title id="fd-title">Archimedes account, research, and vault flow</title>
  <desc id="fd-desc">Account-first workflow from a portfolio brief through research retrieval, agent debate, backtesting, and a rigor gate. Wallet proof is required only for on-chain actions on Arc public testnet. Vault ownership and reasoning verification remain visible.</desc>

  <defs>
    <marker id="arrow-action" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#7E8AFF"/>
    </marker>
    <marker id="arrow-verify" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#52B8A4"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 Z" fill="#697685"/>
    </marker>
  </defs>

  <style>
    text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .ink { fill: #F7F8FA; }
    .muted { fill: #9AA4B1; }
    .quiet { fill: #697685; }
    .action { fill: #7E8AFF; }
    .verify { fill: #52B8A4; }
    .label { font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .title { font-size: 17px; font-weight: 650; }
    .body { font-size: 12px; }
    .small { font-size: 10.5px; }
    .node { fill: #151B23; stroke: #2B3542; stroke-width: 1; }
    .node-action { fill: #171D2C; stroke: #7E8AFF; stroke-width: 1.5; }
    .node-verify { fill: #121F20; stroke: #52B8A4; stroke-width: 1.5; }
  </style>

  <rect x="0.5" y="0.5" width="1239" height="719" rx="12" fill="#0D1218" stroke="#2B3542"/>

  <text x="48" y="45" class="action label">ARCHIMEDES SYSTEM MAP</text>
  <text x="48" y="79" class="ink" font-size="26" font-weight="650">From account intent to accountable execution</text>
  <text x="48" y="104" class="muted body">Research and agent reasoning stay inspectable. Wallet authority appears only where an on-chain signature is required.</text>

  <rect x="48" y="130" width="1144" height="112" rx="9" fill="#11171E" stroke="#2B3542"/>
  <text x="64" y="153" class="quiet label">IDENTITY AND INTENT</text>

  <rect x="70" y="170" width="286" height="52" rx="6" class="node-action"/>
  <text x="84" y="192" class="ink" font-size="14" font-weight="650">Account owns research and settings</text>
  <text x="84" y="210" class="muted small">Email/password; OAuth only when configured</text>

  <line x1="364" y1="196" x2="397" y2="196" stroke="#7E8AFF" stroke-width="1.5" marker-end="url(#arrow-action)"/>

  <rect x="408" y="170" width="276" height="52" rx="6" class="node"/>
  <text x="422" y="192" class="ink title">Describe one portfolio goal</text>
  <text x="422" y="210" class="muted small">Risk, horizon, assets, and constraints</text>

  <rect x="736" y="170" width="430" height="52" rx="6" class="node"/>
  <text x="750" y="192" class="ink title">Wallet proof only for on-chain actions</text>
  <text x="750" y="210" class="muted small">Optional until deploy, deposit, publish, subscribe, or withdraw</text>

  <rect x="48" y="260" width="1144" height="270" rx="9" fill="#11171E" stroke="#2B3542"/>
  <text x="64" y="284" class="quiet label">RESEARCH AND RIGOR · OFF-CHAIN</text>

  <rect x="70" y="306" width="226" height="88" rx="6" class="node"/>
  <text x="84" y="330" class="ink title">Research retrieval</text>
  <text x="84" y="351" class="muted body">Relevant quantitative-finance papers</text>
  <text x="84" y="370" class="muted body">Source references retained</text>

  <line x1="304" y1="350" x2="333" y2="350" stroke="#697685" stroke-width="1.4" marker-end="url(#arrow-muted)"/>

  <rect x="344" y="306" width="206" height="88" rx="6" class="node"/>
  <text x="358" y="330" class="ink title">Market context</text>
  <text x="358" y="351" class="muted body">Regime and price signals</text>
  <text x="358" y="370" class="muted body">Read-only context</text>

  <line x1="558" y1="350" x2="587" y2="350" stroke="#697685" stroke-width="1.4" marker-end="url(#arrow-muted)"/>

  <rect x="598" y="306" width="258" height="88" rx="6" class="node"/>
  <text x="612" y="330" class="ink title">Debate and backtest</text>
  <text x="612" y="351" class="muted body">Candidate methods face critique</text>
  <text x="612" y="370" class="muted body">One candidate or an abstention</text>

  <line x1="864" y1="350" x2="893" y2="350" stroke="#52B8A4" stroke-width="1.4" marker-end="url(#arrow-verify)"/>

  <rect x="904" y="306" width="262" height="88" rx="6" class="node-verify"/>
  <text x="918" y="330" class="verify title">Rigor gate</text>
  <text x="918" y="351" class="muted body">DSR · PBO · walk-forward OOS</text>
  <text x="918" y="370" class="muted body">Look-ahead audit · pass, fail, pending</text>

  <rect x="70" y="424" width="1096" height="78" rx="6" class="node-action"/>
  <text x="84" y="448" class="action label">STRATEGY PASSPORT</text>
  <text x="84" y="474" class="ink title">Winner, cited evidence, considered rejects, assumptions, and gate result</text>
  <text x="862" y="474" class="muted body">Insufficient evidence or rigor → abstain</text>

  <line x1="618" y1="502" x2="618" y2="557" stroke="#7E8AFF" stroke-width="1.5" marker-end="url(#arrow-action)"/>
  <line x1="951" y1="222" x2="951" y2="557" stroke="#697685" stroke-width="1.2" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>
  <text x="963" y="548" class="quiet small">signature boundary</text>

  <line x1="48" y1="548" x2="1192" y2="548" stroke="#52B8A4" stroke-width="1" stroke-dasharray="7 5"/>
  <text x="64" y="542" class="verify small">PUBLIC VERIFICATION BOUNDARY</text>

  <rect x="48" y="566" width="1144" height="108" rx="9" fill="#101A1C" stroke="#29544F"/>
  <text x="64" y="590" class="verify label">ARC PUBLIC TESTNET · NO REAL FUNDS</text>

  <rect x="70" y="608" width="316" height="46" rx="6" class="node"/>
  <text x="84" y="628" class="ink title">Owner-controlled vault</text>
  <text x="84" y="645" class="muted small">Owner authorizes deploy and retains withdrawal authority</text>

  <rect x="462" y="608" width="316" height="46" rx="6" class="node-verify"/>
  <text x="476" y="628" class="ink title">Commit · trade · reveal</text>
  <text x="476" y="645" class="muted small">Reasoning hash precedes each executed action</text>

  <rect x="854" y="608" width="312" height="46" rx="6" class="node"/>
  <text x="868" y="628" class="ink title">Monitor and verify</text>
  <text x="868" y="645" class="muted small">Vault state and trace ordering remain inspectable</text>

  <line x1="394" y1="631" x2="449" y2="631" stroke="#52B8A4" stroke-width="1.4" marker-end="url(#arrow-verify)"/>
  <line x1="786" y1="631" x2="841" y2="631" stroke="#52B8A4" stroke-width="1.4" marker-end="url(#arrow-verify)"/>

  <text x="48" y="701" class="quiet small">Research prototype · Generation can abstain · Live counts appear only when deployment data is available</text>
</svg>
