# Archimedes — Docker Compose for LOCAL development
# Usage: docker compose up --build -d
#
# ── Image refs: local-only by construction (issue #1044, leak 3) ───────────
# `build:` is authoritative here. Every app-tier service resolves to a
# project-scoped, registry-less tag:
#
#     image: ${COMPOSE_PROJECT_NAME:-archimedes}-backend:local
#
# Two failure modes made that shape necessary, and both were live:
#
#  1. REACHING PRODUCTION. These keys used to default to
#     `${ECR_REGISTRY:-037613907429.dkr.ecr.us-east-1.amazonaws.com}/…:${IMAGE_TAG:-latest}`,
#     and neither variable was defined anywhere in `.env.example` — so on a
#     fresh clone the defaults always won. `docker compose up` WITHOUT
#     `--build` (and `docker compose pull`) then made a real request to the
#     production registry; on an ECR-authenticated machine it succeeds and the
#     developer runs the last image CI pushed to prod while believing they are
#     running their working tree. Nothing warns. A registry-less name cannot
#     resolve anywhere, so the only thing that can satisfy it is a local build.
#
#  2. CROSS-CHECKOUT TAG THEFT. `build:` tags the image with whatever `image:`
#     names, and image tags are machine-global while compose projects are not.
#     Every worktree on the box therefore built into the SAME tag, so the last
#     checkout to run `--build` silently owned it and a bare `up` in any other
#     checkout adopted that foreign build. `COMPOSE_PROJECT_NAME` (which
#     compose derives from the directory, or `-p`) scopes the tag per checkout;
#     the `:-archimedes` fallback keeps the historical name for the canonical
#     clone. `migrate`/`oracle`/`agent`/`kb-runner` deliberately share the
#     `-backend:local` tag with `backend` so the image is still built once.
#
# THE ECR PULL PATH STILL EXISTS — it is now opt-in. `docker-compose.ecr.yml`
# restores the registry-qualified refs and REQUIRES `ECR_REGISTRY` and
# `IMAGE_TAG` to be set (no defaults, so a forgotten variable errors instead of
# silently selecting production `:latest`):
#
#     ECR_REGISTRY=… IMAGE_TAG=<sha> \
#       docker compose -f docker-compose.yml -f docker-compose.ecr.yml pull
#
# Note that nothing in CI or production consumes these keys today: since the
# Fargate cutover, `.github/workflows/deploy.yml` registers ECS task
# definitions with explicit image URIs and `deploy-runners.yml` uses raw
# `docker pull`/`docker tag` over SSM. Compose is a local-development tool.
# Guarded by backend/tests/test_compose_no_prod_image_default.py.
#
# ── Compose profiles in this file (two independent gates) ──────────────────
#   `localdb` — postgres + redis, LOCAL DEV ONLY (see the "Data stores" note
#     just below). PRODUCTION's box .env has historically omitted
#     COMPOSE_PROFILES entirely, so these never start there — the app talks
#     to managed Aurora + ElastiCache via DATABASE_URL / REDIS_URL instead.
#   `runners` — oracle / agent / kb-runner (#1043). These are funds-adjacent
#     exactly-once singletons (see services/runner_lease.py) — a bare local
#     `docker compose up` (demo/UI work) should NOT spin up a second live
#     copy racing whatever the operator already has running elsewhere. They
#     start ONLY when `runners` is in COMPOSE_PROFILES.
#     *** OPERATOR NOTE ***
#     This file doubles as the box's actual production compose file
#     (deploy.yml runs `docker compose up -d` against it). The production
#     box's own .env is SELF-HEALED automatically by
#     .github/workflows/deploy.yml on every deploy — it idempotently ensures
#     `runners` is present in COMPOSE_PROFILES there, so oracle/agent/
#     kb-runner keep starting with no manual step required. `runners` is off
#     by default here (this file / .env.example) only for LOCAL
#     `docker compose up` (demo/UI work), so it doesn't accidentally spin up
#     a second live copy racing whatever the operator already has running
#     elsewhere.
services:
  # ---------- Data stores (LOCAL ONLY — see profiles note) ----------
  # postgres + redis run ONLY when the `localdb` profile is active
  # (COMPOSE_PROFILES=localdb, set in .env.example for local dev). In PRODUCTION
  # the .env omits COMPOSE_PROFILES, so these two services are NOT started and
  # the app talks to managed Aurora + ElastiCache via DATABASE_URL / REDIS_URL.
  # This makes ONE compose file serve both: `docker compose up` locally brings up
  # the full self-contained stack; the same command in prod (no localdb profile)
  # runs the app tier against managed stores. See docs/deployment.md.
  postgres:
    # Bumped 16-alpine -> 18-alpine (#777) to match prod Aurora's 18.3 major version.
    #
    # Mount moved to the PARENT dir, `pgdata18:/var/lib/postgresql` (#1119):
    # postgres:18-alpine image revisions since ~2026-07 store data in a
    # major-version-suffixed subdirectory (/var/lib/postgresql/18/docker, for
    # `pg_upgrade --link` support — docker-library/postgres#1259) and HARD-ERROR
    # on a mount at the legacy /var/lib/postgresql/data path, which broke every
    # fresh `docker compose up`.
    #
    # BREAKING for pre-#1119 local envs: the old `pgdata` volume is no longer
    # declared here, so `docker compose down -v` will NOT remove it and your
    # old data is simply orphaned (a fresh, empty `pgdata18` is created on next
    # up). For the usual disposable local dev DB, no action needed — migrations
    # re-run on the empty DB. To reclaim disk: `docker volume rm archimedes_pgdata`.
    # To KEEP old local data: before switching, copy the old volume's contents
    # into the new layout, e.g.
    #   docker run --rm -v archimedes_pgdata:/old -v archimedes_pgdata18:/new \
    #     alpine sh -c 'mkdir -p /new/18/docker && cp -a /old/. /new/18/docker/'
    # (then verify with a throwaway `docker compose up postgres`).
    image: postgres:18-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archimedes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env — no default for security}
      POSTGRES_DB: ${POSTGRES_DB:-archimedes}
    volumes:
      - pgdata18:/var/lib/postgresql
    # NO host port binding — Postgres is only reachable by other containers
    # on the Docker bridge network. Never expose DB ports to the host/internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archimedes}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    # NO host port binding — Redis is internal-only.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Schema migration (LOCAL ONLY) ----------
  # Production runs this same preflight as an ordered one-off ECS task before
  # rollout. Local Compose needs its own one-shot because init_db intentionally
  # never creates PostgreSQL tables. Base-file dependencies stay optional so
  # production can omit localdb; docker-compose.local.yml makes them strict.
  migrate:
    image: ${COMPOSE_PROJECT_NAME:-archimedes}-backend:local
    profiles: ["localdb"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "archimedes.scripts.alembic_migrate_preflight"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
    depends_on:
      postgres:
        condition: service_healthy

  # ---------- Reverse proxy + Frontend ----------
  nginx:
    image: ${COMPOSE_PROJECT_NAME:-archimedes}-nginx:local
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        # VITE_* vars embed into the JS bundle at build time (Vite reads
        # them during `npm run build`). Sourced from the host .env file;
        # empty defaults so the build still succeeds when unconfigured.
        VITE_CIRCLE_CLIENT_KEY: ${VITE_CIRCLE_CLIENT_KEY:-}
        VITE_CIRCLE_CLIENT_URL: ${VITE_CIRCLE_CLIENT_URL:-https://modular-sdk.circle.com/v1/rpc/w3s/buidl}
        VITE_API_BASE: ${VITE_API_BASE:-}
    restart: unless-stopped
    environment:
      # Render the runtime-agnostic nginx template (see nginx.conf's upstream
      # block). In compose, Docker's embedded DNS (127.0.0.11) resolves the
      # `backend` service name at runtime.
      NGINX_ENVSUBST_FILTER: "^NGINX_"
      NGINX_RESOLVER_LINE: "resolver 127.0.0.11 valid=10s ipv6=off;"
      NGINX_BACKEND_UPSTREAM: "backend:8000"
      NGINX_AUTH_UPSTREAM: "auth:3000"
      NGINX_UPSTREAM_RESOLVE: "resolve"
    ports:
      # TLS terminates upstream at CloudFront + the ALB; nginx serves plain
      # HTTP on :8080. No :443/8443 mapping and no cert mounts — the
      # in-container self-signed-cert stopgap is retired (the ALB→nginx hop is
      # plain HTTP, so large responses no longer 502 through that TLS layer).
      - "${ARCHIMEDES_HTTP_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_started
      auth:
        condition: service_healthy

  # ---------- Better Auth ----------
  auth:
    image: ${COMPOSE_PROJECT_NAME:-archimedes}-auth:local
    build:
      context: ./auth
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost}
      BETTER_AUTH_TRUSTED_ORIGINS: ${BETTER_AUTH_TRUSTED_ORIGINS:-http://localhost,http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
        required: false

  # ---------- Oracle (price feeder) ----------
  oracle:
    image: ${COMPOSE_PROJECT_NAME:-archimedes}-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    # #1043 — gated behind the `runners` profile; see the file-header note.
    # A bare local `docker compose up` does NOT start this. It is also a
    # funds-adjacent exactly-once singleton at the application layer
    # (services/runner_lease.py) — this profile gate is a SEPARATE,
    # belt-and-suspenders control for "don't even start a second copy
    # locally", not a substitute for the Redis lease.
    profiles: ["runners"]
    restart: unless-stopped
    # Lets LLM_BASE_URL=http://host.docker.internal:11434 (local Ollama, #1044)
    # reach the host from inside the container on Linux too — Docker Desktop
    # (macOS/Windows) already resolves this name; harmless no-op in prod.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "archimedes.chain.oracle_runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      ORACLE_INTERVAL_SECONDS: ${ORACLE_INTERVAL_SECONDS:-60}
      ARC_VAULT_FACTORY_ADDRESS: ${ARC_VAULT_FACTORY_ADDRESS:-0xca873414070844aeb98b0bf1051f81969c79cc32}
      ARC_REASONING_TRACE_REGISTRY_ADDRESS: ${ARC_REASONING_TRACE_REGISTRY_ADDRESS:-0x42d8a23edb897cbee203e9fa197eb05ab5106ca6}
    env_file:
      - .env
    healthcheck:
      disable: true
    # required: false → these app services still start when postgres/redis are
    # NOT in the active profile (production = managed Aurora/ElastiCache). When
    # the `localdb` profile IS active, they wait for the local DB/cache to be
    # healthy. (required on depends_on needs docker compose ≥ 2.20.)
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
        required: false

  # ---------- Strategy Agent (autonomous portfolio runner) ----------
  agent:
    image: ${COMPOSE_PROJECT_NAME:-archimedes}-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    # #1043 — gated behind the `runners` profile; see the file-header note.
    profiles: ["runners"]
    restart: unless-stopped
    # See the oracle service's comment above (host.docker.internal, #1044).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ["python", "-m", "archimedes.chain.agent_runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AGENT_INTERVAL_SECONDS: ${AGENT_INTERVAL_SECONDS:-300}
      AGENT_DRY_RUN: ${AGENT_DRY_RUN:-false}
      ARC_VAULT_FACTORY_ADDRESS: ${ARC_VAULT_FACTORY_ADDRESS:-0xca873414070844aeb98b0bf1051f81969c79cc32}
      ARC_AMM_ROUTER_ADDRESS: ${ARC_AMM_ROUTER_ADDRESS:-0xd5b829f9d364a8bbe1caf6c8b19cb05371b178f4}
      ARC_REASONING_TRACE_REGISTRY_ADDRESS: ${ARC_REASONING_TRACE_REGISTRY_ADDRESS:-0x42d8a23edb897cbee203e9fa197eb05ab5106ca6}
    env_file:
      - .env
    volumes:
      - ./analytics-engine/strategies:/app/analytics-engine/strategies:ro
      # src/ carries the archimedes_analytics_engine package (fetch_ohlcv) —
      # without it, every real-data backtest in the container fails closed to
      # synthetic/"pending" (dogfood find, 2026-07-01).
      - ./analytics-engine/src:/app/analytics-engine/src:ro
      - ./contracts/abis:/contracts/abis:ro
    healthcheck:
      disable: true
    # required: false → these app services still start when postgres/redis are
    # NOT in the active profile (production = managed Aurora/ElastiCache). When
    # the `localdb` profile IS active, they wait for the local DB/cache to be
    # healthy. (required on depends_on needs docker compose ≥ 2.20.)
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
        required: false

  # ---------- Backend API ----------
  backend:
    image: ${COMPOSE_PROJECT_NAME:-archimedes}-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    # See the oracle service's comment above (host.docker.internal, #1044) —
    # this is the service Generate/chat/rigor actually call through.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # NO host port binding — backend is only reachable via nginx reverse proxy.
    # This ensures all rate limits, CORS, security headers, and the docs gate
    # cannot be bypassed by hitting port 8000 directly.
    expose:
      - "8000"  # visible to other containers (nginx), NOT to the host
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      # Deployed Arc testnet contracts (override via .env if needed)
      ARC_AMM_ROUTER_ADDRESS: ${ARC_AMM_ROUTER_ADDRESS:-0xd5b829f9d364a8bbe1caf6c8b19cb05371b178f4}
      ARC_VAULT_FACTORY_ADDRESS: ${ARC_VAULT_FACTORY_ADDRESS:-0xca873414070844aeb98b0bf1051f81969c79cc32}
      ARC_REASONING_TRACE_REGISTRY_ADDRESS: ${ARC_REASONING_TRACE_REGISTRY_ADDRESS:-0x42d8a23edb897cbee203e9fa197eb05ab5106ca6}
      ARC_ASSET_REGISTRY_ADDRESS: ${ARC_ASSET_REGISTRY_ADDRESS:-0x2d44550711137916df6175587d17886281a0fbc7}
      ARCHIMEDES_STRATEGIES_DIR: /app/analytics-engine/strategies
      ARCHIMEDES_CORPUS_MANIFEST: /app/data/corpus/manifest.jsonl
      KB_ARTIFACT_DIR: /app/data/corpus-artifact
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-}
      BETTER_AUTH_INTERNAL_URL: http://auth:3000
      APP_ENV: ${APP_ENV:-development}
      FEATURE_QUANT: ${FEATURE_QUANT:-}
      EMAIL_ENCRYPTION_KEY: ${EMAIL_ENCRYPTION_KEY:-}
      # Production secret loading: load_ssm_secrets() (main.py, at import time)
      # reads AWS_SSM_PATH_PREFIX/* from SSM and injects the values into the
      # env (e.g. EMAIL_ENCRYPTION_KEY, which prod mode fail-closes on). Two
      # independent things must both be true for that fetch to happen:
      #   1. PUBLIC_DOMAIN is set — main.py's "am I production" gate (#1044).
      #      This is the one that actually stops the fetch, and it is why prod
      #      sets PUBLIC_DOMAIN alongside the prefix in infra/ecs.tf:516-519.
      #   2. AWS_SSM_PATH_PREFIX is non-empty — secrets_service returns 0 on a
      #      blank prefix.
      # The default below is BLANK, not /archimedes/prod/. It used to be the
      # prod path, which silently un-did .env.example's blank default: compose
      # `:-` substitutes on empty as well as unset, so the shipped
      # `AWS_SSM_PATH_PREFIX=` resolved back to the real prod prefix inside the
      # container and left the PUBLIC_DOMAIN gate as the only thing between a
      # local `docker compose up` and production secrets. Defence in depth is
      # the point: neither layer may quietly disarm the other.
      # Production does NOT get this value from compose — post-Fargate, prod is
      # an ECS task definition (infra/ecs.tf, infra/ecs_migrate.tf) that sets
      # the prefix explicitly; compose is local-only. Exporting
      # AWS_SSM_PATH_PREFIX (plus PUBLIC_DOMAIN) still opts a compose run in,
      # for anyone deliberately mimicking prod.
      AWS_SSM_PATH_PREFIX: ${AWS_SSM_PATH_PREFIX:-}
      AWS_REGION: ${AWS_REGION:-us-east-1}
    env_file:
      - .env
    volumes:
      - ./analytics-engine/strategies:/app/analytics-engine/strategies:ro
      # rw: run_backtests (the backtest backfill) WRITES fresh artifact JSONs
      # here; the seeder + provenance readers consume them.
      - ./analytics-engine/artifacts:/app/analytics-engine/artifacts
      # src/ carries the archimedes_analytics_engine package (fetch_ohlcv) —
      # without it, every real-data backtest in the container fails closed to
      # synthetic/"pending" (dogfood find, 2026-07-01).
      - ./analytics-engine/src:/app/analytics-engine/src:ro
      - ./contracts/abis:/contracts/abis:ro
      - ./data/corpus:/app/data/corpus:ro
      - archimedes-corpus-artifact:/app/data/corpus-artifact
    # required: false → these app services still start when postgres/redis are
    # NOT in the active profile (production = managed Aurora/ElastiCache). When
    # the `localdb` profile IS active, they wait for the local DB/cache to be
    # healthy. (required on depends_on needs docker compose ≥ 2.20.)
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
        required: false

  # ---------- KB pipeline runner (Phase 3c skeleton) ----------
  # Polls the corpus + artifact volume and re-runs the SPECTER2 / HDBSCAN /
  # BERTopic / REBEL / SciSpacy pipeline when the trigger conditions hit
  # (≥KB_NEW_PAPER_THRESHOLD papers OR ≥KB_MAX_DAYS_SINCE_LAST days).
  #
  # The pipeline body itself is gated behind KB_PIPELINE_ENABLED — leave
  # unset until the dedicated image with the ~6 GB of model weights ships;
  # the runner simply logs "needs_rerun=False" between ticks meanwhile.
  # See docs/specs/kb-integration-spec.md.
  #
  # #1043 — gated behind the `runners` profile; see the file-header note.
  kb-runner:
    image: ${COMPOSE_PROJECT_NAME:-archimedes}-backend:local
    profiles: ["runners"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "archimedes.services.kb_runner"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      KB_ARTIFACT_DIR: /srv/corpus-artifact
      KB_CORPUS_DIR: /srv/corpus-text
      KB_RUNNER_INTERVAL_SECONDS: ${KB_RUNNER_INTERVAL_SECONDS:-21600}
      KB_NEW_PAPER_THRESHOLD: ${KB_NEW_PAPER_THRESHOLD:-100}
      KB_MAX_DAYS_SINCE_LAST: ${KB_MAX_DAYS_SINCE_LAST:-7}
      KB_PIPELINE_ENABLED: ${KB_PIPELINE_ENABLED:-}
    env_file:
      - .env
    volumes:
      - ./data/corpus:/srv/corpus-text:ro
      - archimedes-corpus-artifact:/srv/corpus-artifact:rw
    # required: false → starts against managed Aurora in prod (no localdb profile).
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      migrate:
        condition: service_completed_successfully
        required: false

volumes:
  # pgdata (legacy /var/lib/postgresql/data mount) replaced by pgdata18 in
  # #1119 — see the comment on the postgres service for the migration note.
  pgdata18:
  archimedes-corpus-artifact:
