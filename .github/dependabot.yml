# Dependabot configuration — weekly dependency bumps.
# Docs: https://docs.github.com/en/code-security/dependabot/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # Frontend — npm (React + Vite + viem)
  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: "[deps][frontend]"
    groups:
      # react-dom throws React error #527 at load when its version differs
      # from react's by anything, patch included, and npm's peer range does
      # not stop it. #1872 bumped react alone and prod rendered a blank page
      # from 2026-09-25 to 2026-10-01. These four move in ONE PR, always;
      # backend/tests/test_ui_react_versions_match.py fails any tree that
      # splits them anyway. One group per update type, because a group
      # applies to version updates OR security updates, not both.
      react:
        applies-to: version-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      react-security:
        applies-to: security-updates
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]

  # Backend — pip (FastAPI + Python deps)
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: "[deps][backend]"
    ignore:
      # torch resolves through the `--extra-index-url .../whl/cpu` in
      # backend/requirements.txt, so the *installed* version reads `2.13.0+cpu`
      # and dependabot rewrites the floor to match: `torch>=2.13.0+cpu,<3.0`.
      # That is not a valid PEP 440 requirement — a local version label is only
      # permitted on `==` or `!=` — so import-guard rejects every such PR. See
      # #1478, and the trailing comment on the torch line in requirements.txt.
      # Selecting the CPU wheel is the index's job, not the specifier's.
      # Only version bumps are suppressed; security advisories still open PRs.
      - dependency-name: torch
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  # Analytics engine — pip
  - package-ecosystem: pip
    directory: /analytics-engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - analytics
    commit-message:
      prefix: "[deps][analytics]"

  # Docker images
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - infra
    commit-message:
      prefix: "[deps][docker]"

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "[deps][ci]"
