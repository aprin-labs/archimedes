# Docs gate — enforces the documentation contract phases 1-5 established.
#
# Phases 1-5 got link breakage to 0.0% across ~1,180 links, made the doc register
# (docs/doc-index.md, docs/README.md until 2026-09-02) a complete index that opens
# "A doc not listed here does not exist", landed 18
# ADRs, and wrote docs/CONVENTIONS.md. None of that was enforced by anything.
# The reorganisation proposal that started this work diagnosed "a fresh
# teammate can't navigate it" four weeks before it began, and eleven files
# landed with no structure in the interim. Enforcement is the difference
# between a cleanup and a convention.
#
# Blocking:
#   links  — every relative markdown link under docs/ and at the repo root
#            resolves. Paths under submodules/ and contracts/lib/ are skipped:
#            they are gitlinks, empty in a non-recursive checkout, so treating
#            them as broken would make this gate permanently red.
#   index  — every docs/**/*.md appears in docs/doc-index.md or in a sub-index it
#            links to (adr/, archive/, quant/, research/, runbooks/).
#
# Informational (continue-on-error, reported in the PR comment only):
#   staleness — `status: current` docs whose verification date is 60+ days old.
#               A stale date is a prompt to verify, not a reason to block a
#               merge; blocking would produce rubber-stamp date bumps and
#               destroy the signal.
#
# ┌─────────────────────────────────────────────────────────────────────────┐
# │ DO NOT MARK THIS A REQUIRED STATUS CHECK.                               │
# │                                                                         │
# │ This workflow is path-filtered. A required check that is path-filtered  │
# │ never reports on a PR that misses the filter, and GitHub treats "never  │
# │ reported" as "pending" forever — every non-docs PR is blocked and       │
# │ cannot be merged without an admin override. If you want this required,  │
# │ you must first add an always-running fallback job (no `paths:` filter)  │
# │ that reports the same check name and passes trivially when the PR       │
# │ touches no docs. Until that job exists, keep this advisory.             │
# └─────────────────────────────────────────────────────────────────────────┘
#
# Everything here also runs locally, identically: `make docs-check`.

name: Docs Gate

on:
  pull_request:
    paths:
      - "docs/**"
      - "*.md"
      - ".github/workflows/docs-gate.yml"
      - ".github/scripts/docs_*.py"

# The repo has been bitten by racing workflows: two runs of the same job on
# successive pushes to one branch both post the marker comment, and whichever
# finishes second wins regardless of which commit it described. Cancelling the
# superseded run makes the comment always describe the tip.
concurrency:
  group: docs-gate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  docs-gate:
    name: Docs — links + index (blocking), staleness (informational)
    runs-on: ubuntu-latest
    steps:
      # No `submodules:` — deliberate. The checkers skip submodules/ and
      # contracts/lib/, so cloning them would cost minutes for zero signal.
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Both blocking checks are stdlib-only by design: no pip install, no
      # supply-chain surface, no network, and they behave the same on a
      # laptop as in CI.

      - name: Links — every relative target resolves (blocking)
        id: links
        run: |
          set -o pipefail
          python .github/scripts/docs_links.py --format github | tee /tmp/links.txt

      - name: Index — every doc is listed (blocking)
        id: index
        if: always()
        run: |
          set -o pipefail
          python .github/scripts/docs_index.py --format github | tee /tmp/index.txt

      - name: Staleness — 60-day report (informational)
        id: staleness
        if: always()
        continue-on-error: true
        run: python .github/scripts/docs_staleness.py --format markdown | tee /tmp/staleness.md

      - name: Post or update PR comment
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const read = p => { try { return fs.readFileSync(p, 'utf8').trim(); } catch { return ''; } };
            const fmt = r => r === 'success' ? '✅ passed' : r === 'skipped' ? '⏭️ skipped' : '❌ failed';

            const linksOutcome = '${{ steps.links.outcome }}';
            const indexOutcome = '${{ steps.index.outcome }}';

            const tail = (txt, n) => txt.split('\n').filter(Boolean).slice(-n).join('\n');
            const details = (title, body) =>
              body ? `\n<details><summary>${title}</summary>\n\n\`\`\`\n${body}\n\`\`\`\n\n</details>\n` : '';

            const links = read('/tmp/links.txt');
            const index = read('/tmp/index.txt');
            const staleness = read('/tmp/staleness.md');

            // Stable marker — repo convention (cf. <!-- quality-gate-v1 -->).
            // Guarantees this comment is edited in place instead of a new one
            // accumulating on every push.
            const marker = '<!-- docs-gate-v1 -->';
            const body = [
              marker,
              '## Docs Gate',
              '',
              '| Check | Blocking | Status |',
              '|---|---|---|',
              `| Relative links resolve | yes | ${fmt(linksOutcome)} |`,
              `| Every doc is indexed | yes | ${fmt(indexOutcome)} |`,
              `| Staleness (60 days) | no — informational | ℹ️ report below |`,
              '',
              linksOutcome !== 'success'
                ? details('Broken relative links', tail(links, 40))
                : `Links: ${tail(links, 1)}`,
              indexOutcome !== 'success'
                ? details('Docs missing from the register — add a row to `docs/doc-index.md` or a sub-index', tail(index, 40))
                : `Index: ${tail(index, 1)}`,
              '',
              staleness || '_Staleness report unavailable._',
              '',
              '---',
              'Run locally before pushing: `make docs-check`. Conventions: [`docs/CONVENTIONS.md`](docs/CONVENTIONS.md).',
              'This workflow is path-filtered and must **not** be a required status check — see the header comment.',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      # Runs last so the PR comment is always posted before the job fails.
      - name: Fail if a blocking check failed
        if: always() && (steps.links.outcome != 'success' || steps.index.outcome != 'success')
        run: |
          echo "::error::Docs gate failed. links=${{ steps.links.outcome }} index=${{ steps.index.outcome }}"
          echo "Reproduce locally with: make docs-check"
          exit 1
