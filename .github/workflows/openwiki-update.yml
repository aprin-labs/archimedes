# This workflow cannot run today. Read this before enabling it.
#
# OpenWiki's native mode needs a model provider. The provider intended here is
# Bedrock in the production account (037613907429 / us-east-1), and Bedrock's
# Anthropic models are NOT enabled there. Measured 2026-08-31 with the caller's
# own SSO credentials:
#
#   aws bedrock-runtime converse --model-id us.anthropic.claude-sonnet-4-6 ...
#     -> ResourceNotFoundException: Model use case details have not been
#        submitted for this account. Fill out the Anthropic use case details
#        form before using the model.
#
#   aws bedrock-runtime converse --model-id us.anthropic.claude-sonnet-5 ...
#     -> AccessDeniedException: anthropic.claude-sonnet-5 is not available for
#        this account.
#
# Two consequences. First, unblocking needs a console action nobody can automate:
# submit the Anthropic use-case form in Bedrock. Second, the model id below is
# deliberately NOT sonnet-5 — that one is refused for this account even after the
# form; sonnet-4-6 is the newest profile the account lists.
#
# The `schedule:` trigger is commented out on purpose. A daily job that fails
# every morning on a credential gap is noise, and the noise trains people to
# ignore the workflow. Re-enable the cron in the same change that proves a manual
# `workflow_dispatch` run succeeded.
#
# The wiki committed in this PR was NOT produced by this workflow. It was produced
# by OpenWiki's coding-agent integration, which uses the host agent's own model
# session and needs no provider credentials at all -- see
# docs/decisions/tooling-adoptions-2026-08.md.

name: OpenWiki Update

on:
  workflow_dispatch:
  # Re-enable only after a manual run succeeds. See the note at the top.
  # schedule:
  #   - cron: "0 8 * * *"

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so `openwiki code --update` can diff HEAD against the
          # commit it last documented; a shallow clone hides that commit and the
          # update runs against an empty change summary.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install OpenWiki
        # mermaid + jsdom are optional; they add high-fidelity validation of
        # Mermaid diagrams. The quant slice has none today, so they are cheap
        # insurance rather than a requirement.
        run: npm install --global openwiki@0.4.3 mermaid@11.16.0 jsdom@29.1.1

      - name: Run OpenWiki
        run: openwiki code --update --print
        env:
          OPENWIKI_PROVIDER: bedrock
          # When these two are unset OpenWiki falls back to the AWS SDK default
          # credential chain (OIDC/web identity, IAM role, profile). Prefer an
          # OIDC role over long-lived keys when this is wired up.
          BEDROCK_AWS_ACCESS_KEY_ID: ${{ secrets.BEDROCK_AWS_ACCESS_KEY_ID }}
          BEDROCK_AWS_SECRET_ACCESS_KEY: ${{ secrets.BEDROCK_AWS_SECRET_ACCESS_KEY }}
          BEDROCK_AWS_REGION: ${{ vars.BEDROCK_AWS_REGION }}
          # NOT claude-sonnet-5 — that inference profile is listed for the
          # account but refused on invoke. Verify with
          #   aws bedrock list-inference-profiles --region us-east-1
          # and a one-token `converse` call before changing this.
          OPENWIKI_MODEL_ID: "us.anthropic.claude-sonnet-4-6"

      - name: Create OpenWiki update pull request
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          add-paths: |
            openwiki
            AGENTS.md
            CLAUDE.md
          branch: openwiki/update
          commit-message: "docs: update OpenWiki"
          title: "docs: update OpenWiki"
          body: |
            Automated OpenWiki documentation update.

            Generated by the OpenWiki workflow. The read boundary is
            `.openwikiignore`, which is an allow-list scoped to one slice —
            widen it one slice at a time and record the cost in
            `docs/decisions/tooling-adoptions-2026-08.md`.
