# Quality gate — runs on every PR to main and on direct pushes to main.
#
# Hard block:
#   backend-tests  — pytest unit suite (no DB/Redis required)
#   ruff-gate      — ruff format --check + ruff check --select E9,F63,F7,F40
#                    (formatting + syntax/runtime-error rules; whole repo via root ruff.toml)
#
# Informational table (posted as PR comment):
#   ruff linter    — full `ruff check` (broader rule set; not blocking yet)
#   eslint         — npm run lint
#   coverage       — unit coverage vs 60% floor (agent PRs only)
#   supply-chain   — pip-audit + npm audit (ui prod, ui dev, wallet-setup) +
#                    detect-secrets (non-blocking; see the supply-chain job
#                    below for the promote-to-hard-block note)

name: Quality Gate

on:
  pull_request:
    branches: [main]
  # Also runs on direct pushes to main so test results are visible in CI history
  # (the agentic CI system pushes directly to main; this surfaces test status
  # without blocking deployment — deploy.yml is a separate workflow).
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Deliberately NOT path-filtered, and deliberately in this always-on
  # workflow. A path-filtered job that is later marked a required status check
  # never reports on a PR that misses its paths, so the check sits in
  # "Expected" forever and that PR can never merge. This job runs on every PR,
  # costs a couple of seconds, and is therefore safe to require.
  infra-guards:
    name: Infra — user-data size guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # `bash <script>` rather than `./<script>` so the job does not depend on
      # the executable bit surviving every checkout/copy path.
      - name: EC2 user-data stays under the 16 KB limit
        run: bash ./infra/scripts/check-user-data-size.sh

  # The analytics engine had NO CI coverage at all until now. pytest.ini sets
  # `testpaths = backend/tests` and lists analytics-engine under
  # `norecursedirs`, and no workflow ran its suite — so its 227 tests never
  # executed on a PR. That is how #1203 (which re-routed EVERY backtest to its
  # declared ASSET_UNIVERSE, and therefore determines every number the product
  # publishes) merged with a full row of green checks and zero automated
  # verification of the code it changed. The engine sits on the MVP critical
  # path; it gets its own gate.
  #
  # Deliberately NOT path-filtered, for the same reason as infra-guards above:
  # a path-filtered job marked as a required check never reports on PRs that
  # miss its paths, so the check sits in "Expected" forever and the PR can
  # never merge.
  # Guards the alembic chain against the recurring fork bug: two PRs each add
  # a migration whose down_revision points at the SAME parent (the head each
  # saw when it branched). Whichever merges first becomes the new head; the
  # other's migration is now parented on a stale revision — `alembic upgrade
  # head` can't resolve that on its own. Bit three times already (the Aug 3
  # deploy, and twice on #1194).
  #
  # Deliberately NOT path-filtered at the trigger level, for the same reason
  # as infra-guards above: a path-filtered required check never reports on a
  # PR that misses its paths, so it sits in "Expected" forever and blocks
  # merge permanently. The script itself early-exits the moment it finds no
  # changed migration files vs the merge-base — checkout + one git diff, no
  # pip install — so a non-migration PR pays only a few seconds for this job.
  migration-chain-guard:
    name: Migrations — chain fork guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      # actions/checkout on a pull_request event does not otherwise leave a
      # resolvable `origin/main` ref lying around — it fetches only the ref
      # it checks out. The guard needs `origin/main` to name main's CURRENT
      # tip, not a stale snapshot, so fetch it explicitly.
      - run: git fetch origin main:refs/remotes/origin/main
      - name: New migrations must extend main's current chain head, not fork it
        run: python3 .github/scripts/migration_chain_guard.py

  engine-tests:
    name: Analytics engine — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        # The engine declares its own deps in analytics-engine/pyproject.toml
        # (backtrader/pandas/yfinance). Installed as a package so the suite
        # exercises the same import path production uses. pytest-socket is what
        # makes the "no network" claim below true rather than aspirational.
        run: pip install --quiet ./analytics-engine "pytest>=8.2" pytest-socket
      - name: Test
        # --override-ini="pythonpath=" — analytics-engine/pyproject.toml sets
        #   [tool.pytest.ini_options] pythonpath = ["src"], which PREPENDS the
        #   working tree to sys.path under pytest. Without this override the
        #   suite imports from analytics-engine/src/ and the pip install above
        #   is decorative: a packaging or import-path break would pass CI.
        #   Measured, not assumed — with the setting active the suite imports
        #   from .../analytics-engine/src/...; with it overridden it imports
        #   from .../site-packages/....
        #
        # --disable-socket — a GitHub runner has outbound network, so "hermetic"
        #   is not free. A test that quietly reached yfinance would make this
        #   gate flaky AND make a data-provider outage look like a code failure.
        #   Blocking sockets makes that structurally impossible instead of
        #   relying on nobody adding such a test later.
        run: python -m pytest analytics-engine/tests -q --override-ini="pythonpath=" --disable-socket

  backend-tests:
    name: Backend — unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install libpq headers (source-built psycopg2, #1632)
        # requirements-base.txt asks for `psycopg2`, not `psycopg2-binary`, so pip
        # COMPILES it here and needs `pg_config` + the libpq headers. The runner
        # image ships libpq5 but not reliably the -dev package, and without it the
        # install below fails with "pg_config executable not found". gcc is already
        # on the runner. (The swap exists because the binary wheel vendors a second
        # OpenSSL — see backend/requirements-base.txt.)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev

      - name: Install
        # Unit tests never load the embedding model — paper_rag.py lazy-imports
        # torch/sentence-transformers and falls back to TF-IDF on ImportError, and
        # test_paper_rag.py mocks sentence_transformers. Skipping them here keeps the
        # required check off the pytorch wheel CDN (an SSL-flaky external dependency)
        # and cuts ~2.5GB + minutes off every run. They stay in the prod Docker image.
        # requirements-base.txt IS that set: it is backend/requirements.txt minus
        # the index URL and the two torch packages (issue #1522), so CI installs
        # it directly instead of grepping the exclusions back out at runtime.
        run: |
          pip install --quiet -r backend/requirements-base.txt "pytest>=8.3" "pytest-asyncio>=0.24" "pytest-cov>=5.0" "fakeredis[lua]>=2.26.0" "pathspec>=0.12"
      - name: Test
        run: pytest -m "not integration" --tb=short -q
      - name: CLI tests
        # archimedes-cli has its own small suite (click + httpx, mocked at the
        # boundary, no network) — running it here makes the CLI's test claims
        # CI-backed instead of author-attested (#1307 review finding).
        run: |
          pip install --quiet -e ./cli
          python -m pytest cli/tests --tb=short -q
      - name: MCP server tests
        # archimedes-mcp is a second small distribution (mcp SDK + httpx, mocked at the
        # same boundary, no network). Same reason as the CLI step above: its claims —
        # notably "the credential never appears in any output" — must be CI-backed.
        # Installed AFTER ./cli because it depends on it for the session-cache loader.
        run: |
          pip install --quiet -e ./cli -e ./mcp-server
          python -m pytest mcp-server/tests --tb=short -q

  frontend-and-auth:
    name: Frontend + Better Auth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            auth/package-lock.json
      - run: cd ui && npm ci --quiet && npm test && npm run lint && npm run build
      - run: cd auth && npm ci --quiet && npm test

  ruff-gate:
    # Blocking gate for formatting + the critical lint rule families that
    # catch real bugs (syntax errors, undefined names/modules). Reads root
    # ruff.toml. The broader `ruff check` set is still informational in
    # lint-report. Add more rules to --select as the codebase converges.
    name: Ruff — format + critical lint rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to match .pre-commit-config.yaml's ruff-pre-commit rev — an
      # unpinned install here silently drifts to whatever ruff just released,
      # which can reformat files differently than the last commit that ran
      # `ruff format .` and fail every open PR for a reason unrelated to its
      # diff. Bump both together when intentionally upgrading ruff.
      - run: pip install --quiet ruff==0.15.13
      - name: ruff format --check
        run: ruff format --check .
      - name: ruff check (critical rules only)
        run: ruff check --select E9,F63,F7,F40,F82 .

  lint-report:
    name: Lint — report table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Pinned to match ruff-gate + .pre-commit-config.yaml (see comment there).
      - run: pip install --quiet ruff==0.15.13

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: cd ui && npm ci --quiet

      - name: ruff
        id: ruff
        continue-on-error: true
        run: |
          # Whole-repo informational report (reads root ruff.toml).
          # The blocking subset (format + critical rules) lives in ruff-gate above.
          ruff check . --output-format=json 2>/dev/null > /tmp/ruff.json || true
          ruff format --check . > /tmp/ruff_fmt.txt 2>&1 || true
          python3 - <<'EOF'
          import json, os, re
          # 1) Lint-error count from JSON output (real ruff check . errors).
          try:
              errors = len(json.load(open("/tmp/ruff.json")))
          except Exception:
              errors = 0
          # 2) Format-error count: WOULD-BE-REFORMATTED files only.
          #    Earlier version used /(\d+) file/ which matched BOTH "X files
          #    would be reformatted" AND "X files already formatted". When all
          #    files are formatted, ruff outputs only the latter line and the
          #    old regex counted clean files as errors (false 196 on PR #204).
          try:
              fmt_text = open("/tmp/ruff_fmt.txt").read()
              m = re.search(r"(\d+) files? would be reformatted", fmt_text)
              if m:
                  errors += int(m.group(1))
          except Exception:
              pass
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          out.write(f"result={'passed' if errors == 0 else 'not passed'}\n")
          out.write(f"errors={errors}\n")
          EOF

      - name: eslint
        id: eslint
        continue-on-error: true
        run: |
          cd ui && npm run lint > /tmp/eslint.txt 2>&1 || true
          python3 - <<'EOF'
          import os, re
          try:
              txt = open("/tmp/eslint.txt").read()
              m = re.search(r"(\d+) error", txt)
              errors = int(m.group(1)) if m else 0
              m = re.search(r"(\d+) warning", txt)
              warnings = int(m.group(1)) if m else 0
          except Exception:
              errors, warnings = 0, 0
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          out.write(f"result={'passed' if errors == 0 and warnings == 0 else 'not passed'}\n")
          out.write(f"errors={errors}\n")
          out.write(f"warnings={warnings}\n")
          EOF

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            const fmt = r => r === 'passed' ? '✅ passed' : '❌ not passed';
            const ruff        = fmt('${{ steps.ruff.outputs.result }}');
            const ruffErrors  = '${{ steps.ruff.outputs.errors }}' || '0';
            const eslint      = fmt('${{ steps.eslint.outputs.result }}');
            const eslintErr   = '${{ steps.eslint.outputs.errors }}' || '0';
            const eslintWarn  = '${{ steps.eslint.outputs.warnings }}' || '0';

            const marker = '<!-- quality-gate-v1 -->';
            const body = [
              marker,
              '## Quality Gate',
              '',
              '| Check | Status | Errors | Warnings |',
              '|---|---|---|---|',
              `| ruff linter (python) | ${ruff} | ${ruffErrors} | — |`,
              `| eslint (frontend) | ${eslint} | ${eslintErr} | ${eslintWarn} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  coverage-gate:
    name: Backend — coverage (agent PRs only)
    if: github.event.pull_request.user.login == 't2o2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # libpq headers for the source-built psycopg2 (#1632) — same reason as the
      # unit-test job above: the binary wheel vendored a second OpenSSL, so pip
      # now compiles psycopg2 and needs pg_config.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq libpq-dev
      # Same torch/sentence-transformers skip as the unit-test job above
      # (CDN-independent) — requirements-base.txt is exactly that set (#1522).
      - run: |
          pip install --quiet -r backend/requirements-base.txt "pytest>=8.3" "pytest-asyncio>=0.24" "pytest-cov>=5.0" "pathspec>=0.12"
      - run: pytest -m "not integration" --cov=archimedes --cov-fail-under=60 --tb=short -q

  supply-chain:
    # INFORMATIONAL ONLY — every step runs with continue-on-error and the job
    # never blocks merge. It surfaces dependency CVEs (pip-audit + npm audit
    # across BOTH npm projects, ui/ and wallet-setup/) and leaked-secret
    # regressions (detect-secrets) as a PR-comment table so the signal is
    # visible without gating the build.
    #
    # Coverage note (#1198): this job used to be blind to wallet-setup/'s
    # dependencies entirely, and to ui/'s devDependencies (--omit=dev on the
    # only npm audit step). Both are now separate rows in the report table —
    # a reader should never infer "clean" for a scope this job doesn't
    # actually measure. wallet-setup/ has no devDependencies today, so one
    # audit covers it; ui/ gets a prod row and a dev-only-delta row.
    #
    # Informational first; promote dependency audits to hard-block once known
    # CVE backlog is cleared. Until then, a red row is a triage nudge, not a wall.
    name: Supply chain — report table
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            ui/package-lock.json
            wallet-setup/package-lock.json

      - name: pip-audit
        id: pip_audit
        continue-on-error: true
        run: |
          pip install --quiet pip-audit==2.10.1
          # Current Vyper already contains both fixes; advisory ranges falsely
          # include 0.4.3. PYSEC-2026-3609 / PYSEC-2026-3654 (pymdown-extensions,
          # also via titanoboa) are unreachable and the fix version is
          # unsatisfiable against titanoboa's exact mkdocs-material pin. See
          # backend/requirements-base.txt for full rationale on both pairs.
          pip-audit -r backend/requirements.txt --format json --progress-spinner=off \
            --ignore-vuln PYSEC-2023-142 --ignore-vuln PYSEC-2025-33 \
            --ignore-vuln PYSEC-2026-3609 --ignore-vuln PYSEC-2026-3654 \
            > /tmp/pip_audit.json || true
          python3 - <<'EOF'
          import json, os
          # pip-audit JSON shape: {"dependencies": [{"name": ..., "vulns": [...]}, ...]}.
          data = json.load(open("/tmp/pip_audit.json"))
          deps = data.get("dependencies", data) if isinstance(data, dict) else data
          count = sum(len(d.get("vulns", [])) for d in deps)
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          out.write(f"result={'passed' if count == 0 else 'not passed'}\n")
          out.write(f"count={count}\n")
          EOF

      - name: npm audit (ui, prod)
        id: npm_audit_ui_prod
        continue-on-error: true
        run: |
          cd ui
          # --omit=dev mirrors the prod-only audit we run locally (see CLAUDE.md
          # supply-chain conventions). --json emits the structured report.
          npm audit --omit=dev --json > /tmp/npm_audit_ui_prod.json 2>/dev/null || true
          python3 - <<'EOF'
          import json, os
          # npm audit --json shape: {"metadata": {"vulnerabilities": {"total": N, ...}}}.
          # On failure (no lockfile, registry/network error) npm still emits
          # valid JSON, but as {"error": {"code": ..., ...}} with no "metadata"
          # key. #1198 was filed because a scope this job never measured still
          # rendered green; falling through .get("metadata", {}) to count=0
          # reintroduces that exact defect for the audit's own error path. Treat
          # a missing report as a distinct, visibly-not-clean outcome instead.
          try:
              data = json.load(open("/tmp/npm_audit_ui_prod.json"))
          except Exception:
              data = {}
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if "metadata" not in data:
              out.write("result=error\n")
              out.write(f"count={data.get('error', {}).get('code', 'unknown')}\n")
          else:
              count = data["metadata"].get("vulnerabilities", {}).get("total", 0)
              out.write(f"result={'passed' if count == 0 else 'not passed'}\n")
              out.write(f"count={count}\n")
          EOF

      - name: npm audit (ui, dev)
        id: npm_audit_ui_dev
        continue-on-error: true
        # #1198: --omit=dev on the step above structurally excludes
        # devDependencies (4 of the 14 alerts that accumulated silently pre-
        # #1155 were exactly this). Run the unrestricted audit and report the
        # dev-only delta as its own row, rather than folding it into "prod"
        # silently or dropping --omit=dev and losing the prod-only signal.
        run: |
          cd ui
          npm audit --json > /tmp/npm_audit_ui_full.json 2>/dev/null || true
          python3 - <<'EOF'
          import json, os
          # Same missing-report guard as the prod step above. Also: the delta
          # below is only meaningful if the prod baseline is itself trustworthy
          # — if that step's report was unparsable, "full - prod" would quietly
          # compute a wrong delta against an implied prod count of 0. Propagate
          # the upstream error instead of manufacturing a number from it.
          try:
              full = json.load(open("/tmp/npm_audit_ui_full.json"))
          except Exception:
              full = {}
          prod_result = "${{ steps.npm_audit_ui_prod.outputs.result }}"
          prod_count_raw = "${{ steps.npm_audit_ui_prod.outputs.count }}"
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if "metadata" not in full:
              out.write("result=error\n")
              out.write(f"count={full.get('error', {}).get('code', 'unknown')}\n")
          elif prod_result == "error":
              out.write("result=error\n")
              out.write(f"count=prod-audit-{prod_count_raw or 'unknown'}\n")
          else:
              full_count = full["metadata"].get("vulnerabilities", {}).get("total", 0)
              prod_count = int(prod_count_raw or "0")
              count = max(full_count - prod_count, 0)
              out.write(f"result={'passed' if count == 0 else 'not passed'}\n")
              out.write(f"count={count}\n")
          EOF

      - name: npm audit (wallet-setup)
        id: npm_audit_wallet
        continue-on-error: true
        # #1198: wallet-setup/ was never audited by any CI job. It is a real
        # npm project with runtime (not dev) deps used by ops scripts
        # (create-wallet.mjs, deploy.mjs, rotate-secret.mjs, setvault.mjs) —
        # production-risk surface, not tooling noise. No --omit=dev: the
        # project has no devDependencies today, so the unrestricted audit is
        # already the runtime-only scope.
        run: |
          cd wallet-setup
          npm audit --json > /tmp/npm_audit_wallet.json 2>/dev/null || true
          python3 - <<'EOF'
          import json, os
          # Same missing-report guard as the ui audit steps above — see the
          # comment there for why a missing "metadata" key must not read as
          # count=0.
          try:
              data = json.load(open("/tmp/npm_audit_wallet.json"))
          except Exception:
              data = {}
          out = open(os.environ["GITHUB_OUTPUT"], "a")
          if "metadata" not in data:
              out.write("result=error\n")
              out.write(f"count={data.get('error', {}).get('code', 'unknown')}\n")
          else:
              count = data["metadata"].get("vulnerabilities", {}).get("total", 0)
              out.write(f"result={'passed' if count == 0 else 'not passed'}\n")
              out.write(f"count={count}\n")
          EOF

      - name: detect-secrets
        id: detect_secrets
        continue-on-error: true
        run: |  # pragma: allowlist secret
          pip install --quiet detect-secrets==1.5.0
          base_sha="${{ github.event.pull_request.base.sha || github.event.before }}"
          mapfile -d '' changed < <(
            git diff --diff-filter=ACMR --name-only -z "$base_sha" "$GITHUB_SHA"
          )

          status=0
          if ((${#changed[@]})); then
            detect-secrets-hook --json --baseline .secrets.baseline \
              --exclude-files '(^|/)(package-lock\.json|\.secrets\.baseline)$' \
              "${changed[@]}" > /tmp/secrets_scan.json || status=$?
          fi
          if ((status > 1)); then
            exit "$status"
          fi

          new_found=0
          if ((status == 1)); then
            new_found=$(python3 - <<'EOF'
          import json

          report = json.load(open("/tmp/secrets_scan.json"))
          print(sum(len(findings) for findings in report.get("results", {}).values()))
          EOF
          )
          fi
          echo "result=$([[ $new_found == 0 ]] && echo passed || echo 'not passed')" >> "$GITHUB_OUTPUT"
          echo "count=$new_found" >> "$GITHUB_OUTPUT"

      - name: Post or update PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          script: |
            // 'error' is a distinct third outcome (audit didn't run — no
            // lockfile, registry failure, etc.) and must render as neither
            // ✅ nor ❌: a reader should never infer "clean" OR "vulnerable"
            // for a scope this job structurally failed to measure.
            const fmt = r => r === 'passed' ? '✅ passed' : r === 'error' ? '⚠️ audit did not run' : '❌ not passed';
            const pipResult      = fmt('${{ steps.pip_audit.outputs.result }}');
            const pipCount       = '${{ steps.pip_audit.outputs.count }}' || '0';
            const npmUiProdResult = fmt('${{ steps.npm_audit_ui_prod.outputs.result }}');
            const npmUiProdCount  = '${{ steps.npm_audit_ui_prod.outputs.count }}' || '0';
            const npmUiDevResult  = fmt('${{ steps.npm_audit_ui_dev.outputs.result }}');
            const npmUiDevCount   = '${{ steps.npm_audit_ui_dev.outputs.count }}' || '0';
            const npmWalletResult = fmt('${{ steps.npm_audit_wallet.outputs.result }}');
            const npmWalletCount  = '${{ steps.npm_audit_wallet.outputs.count }}' || '0';
            const secResult   = fmt('${{ steps.detect_secrets.outputs.result }}');
            const secCount    = '${{ steps.detect_secrets.outputs.count }}' || '0';

            // Match on the version-agnostic prefix, not the exact v2 string, so
            // bumping the marker updates an existing v1 comment in place rather
            // than orphaning it — leaving both the stale, scope-silent v1 table
            // AND the new v2 table visible on every PR that had a v1 comment
            // before this change (verified live on #1095 and #1271).
            const markerPrefix = '<!-- supply-chain-v';
            const marker = '<!-- supply-chain-v2 -->';
            const body = [
              marker,
              '## Supply Chain (informational)',
              '',
              'Non-blocking. Promote dependency audits to hard-block once known',
              'CVE backlog is cleared. Scope per row is explicit — a row not',
              'listed here is not covered by this job (see GitHub\'s native',
              'Dependabot tab for the full picture).',
              '',
              '| Check | Status | Count |',
              '|---|---|---|',
              `| pip-audit (backend, python deps) | ${pipResult} | ${pipCount} |`,
              `| npm audit (ui, **prod-only**) | ${npmUiProdResult} | ${npmUiProdCount} |`,
              `| npm audit (ui, **dev-only**) | ${npmUiDevResult} | ${npmUiDevCount} |`,
              `| npm audit (wallet-setup, runtime deps) | ${npmWalletResult} | ${npmWalletCount} |`,
              `| detect-secrets (changed files) | ${secResult} | ${secCount} |`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c => c.body.includes(markerPrefix));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
