# Contracts test gate — builds and tests the Foundry contracts on every PR that
# touches contracts/**. Closes the gap where Solidity was never auto-tested in CI:
# the 5 suites (AMM, PriceOracle, Registry, SyntheticVault, Vault — 181 tests) only
# ever ran on a contributor's laptop. This makes `forge build` + `forge test` a real
# (blocking) check for contract PRs, mirroring the Python gate's discipline.
#
# Scoped narrow with a paths: filter so it never runs on non-contract PRs. The deps
# (forge-std, openzeppelin-contracts) are git submodules under contracts/lib/ pinned
# to contracts/foundry.lock; checkout pulls them with submodules: recursive.

name: contracts-test

on:
  pull_request:
    paths:
      - "contracts/**"
      # ...but not the cached ABI JSON. `forge config` reports this project's source
      # set as src + test + script + lib; contracts/abis/ is in none of them, so a
      # change confined to it cannot alter `forge build` or `forge test` output — the
      # trigger is a false positive by construction. Nothing is lost by skipping it:
      # contracts/abis/*.json is consumed by the Python side (chain/contracts.py,
      # deploy_contracts.py) and guarded there by backend/tests/chain/
      # test_create_vault_abi_consistency.py + test_commit_reveal_tradeid.py, which
      # run in the required "Backend — unit tests" check on every PR. Added by #1626,
      # which adds one ABI JSON and no Solidity, and still spent 3 minutes of runner
      # time building 74 .sol files it does not touch.
      - "!contracts/abis/**"
      - ".github/workflows/contracts-test.yml"

# Least-privilege GITHUB_TOKEN: this workflow only reads the repo to build + test
# the contracts; it never writes. The explicit block satisfies CodeQL
# actions/missing-workflow-permissions and bounds blast radius if a third-party
# action in the job is ever compromised.
permissions:
  contents: read

jobs:
  contracts-test:
    name: Contracts — forge build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Restores contracts/lib/forge-std + contracts/lib/openzeppelin-contracts
          # at the revs pinned in .gitmodules / foundry.lock so forge can resolve the
          # @openzeppelin/ and forge-std/ import remappings.
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          # Pinned 2026-08-31. Unpinned, this action tracks latest stable, and the
          # toolchain moved under us between the last green run (08-20) and today:
          # the newer forge's lint-on-build pass floods the log and the job died
          # with SIGTERM/cancellation on three consecutive runs (one after 40
          # minutes) with zero Solidity changes in the PR. v1.7.1 matches the
          # version the contracts were last built and tested with locally.
          version: v1.7.1
      - name: forge build
        working-directory: contracts
        run: forge build
      - name: forge test
        working-directory: contracts
        run: forge test -vv
