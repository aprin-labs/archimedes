# Archimedes — Build (CI) → ECR → Deploy to EC2 via SSM (no SSH keys)
#
# Authentication: OIDC federation (GitHub → AWS IAM role assumption).
# No long-lived AWS access keys in GitHub Secrets.
#
# Secrets: PULL-MODEL for RUNTIME app secrets — this workflow injects no
#   runtime secret into either deploy target. LLM_PROVIDER/LLM_AUTH_TOKEN/
#   LLM_BASE_URL/EMAIL_ENCRYPTION_KEY live in AWS SSM Parameter Store under
#   /archimedes/prod/* and are read at runtime (the EC2 instance role today;
#   the ECS task execution role's `secrets` block, infra/ecs.tf, once Fargate
#   is live). Population runbook: infra/iam/README.md § "SSM Parameter Store
#   — app secrets".
#   ONE EXCEPTION — VITE_CIRCLE_CLIENT_KEY (+ VITE_CIRCLE_CLIENT_URL /
#   VITE_API_BASE) is a BUILD-TIME frontend value: Vite bakes it into the
#   static JS bundle during `npm run build` (nginx/Dockerfile's `ui-build`
#   stage), so no runtime env var or SSM read can supply it after the fact —
#   it MUST be a Docker `--build-arg` on the "Build nginx image" step below,
#   sourced from a GitHub Actions repo secret/variable (fine to store there:
#   it's a Circle TEST client key that ships inside the public browser bundle
#   by design, not a backend secret). See that step's own comment for detail.
#
# Pipeline (issue #1039 — "build-in-CI is not redundant with Fargate, it is its
# prerequisite"): this workflow has THREE jobs, gated on the SAME
# DEPLOY_ENABLED flag so the whole pipeline is one on/off switch:
#
#   build-and-push   Builds the backend image (backend/Dockerfile) and the
#                    nginx/frontend image (nginx/Dockerfile) on the CI runner,
#                    boots each in a throwaway container and curls /health
#                    (backend directly; nginx through its reverse-proxy path,
#                    which also exercises the docker-network DNS resolution to
#                    a `backend` container) — a bad image is caught HERE,
#                    before it ever reaches ECR or a serving host — then tags
#                    both <commit-sha> + latest and pushes to ECR.
#   migrate          (needs: build-and-push) Runs `alembic upgrade head` as a
#                    one-off ECS Fargate task, ordered BEFORE `deploy-ecs` — the
#                    #1039 P4 / #1028 Phase A shared migrate stage. Fails closed
#                    if the schema can't reach head, so a new task never serves
#                    an out-of-date DB.
#   deploy-ecs       (needs: [build-and-push, migrate]) Registers a new ECS task
#                    definition revision pointing at the just-pushed <commit-sha>
#                    image and force-redeploys the Fargate service behind the
#                    existing ALB. NO docker build ever runs on a serving host.
#                    Then polls the service's own `rolloutState` to an explicit
#                    verdict (issue #1532 — a slow rollout and a broken revision
#                    used to produce the same red, and a green used to mean only
#                    "ECS is content"), probes the live /api/health through
#                    CloudFront to assert the app actually ANSWERS, and — keyed
#                    to that rollout verdict rather than to job success —
#                    invalidates the
#                    CloudFront cache for the unhashed SPA entry points (/ and
#                    /index.html) — without this, CloudFront keeps serving the
#                    OLD cached index.html, which references hashed asset
#                    filenames the new deploy just deleted, until the html
#                    cache policy's TTL expires (blank page / 404s in the
#                    meantime). See "Invalidate CloudFront" step below and
#                    infra/cloudfront.tf's `github_deploy_cloudfront` IAM grant.
#                    (The legacy `deploy` job — SSM into the EC2 box + `docker
#                    compose up` — was RETIRED in the #1039 observability
#                    fast-follow: post-cutover the box is detached from the ALB,
#                    so auto-deploying to it was pointless and its broken step
#                    reddened every run. The box stays running as a rollback
#                    window until Phase 8 decommission.)
#
# ECR repos expected: `archimedes-backend` (shared by the backend/oracle/agent/
# kb-runner services — same image, different `command:` override, exactly as
# today) and `archimedes-nginx`. Provisioned by Terraform (issue #1039 chunk 2,
# infra/ecr.tf — not part of this PR); build-and-push fails with a clear
# `::error::` if a repo doesn't exist yet rather than a bare AWS API error.
#
# HISTORICAL (superseded by the ECS Fargate cutover; corrected 2026-08-31,
# #1044). This paragraph described a box-side `docker compose pull` deploy:
# the EC2 instance role (`archimedes-backend-role`) needing
# ecr:GetAuthorizationToken + ecr:BatchGetImage + ecr:GetDownloadUrl +
# ecr:BatchCheckLayerAvailability on repository/archimedes*, plus `awscli` on
# the box. THAT PATH NO LONGER EXISTS. This workflow deploys by registering
# ECS task definitions with explicit image URIs (see the `deploy-ecs` job) and
# never invokes compose; `deploy-runners.yml` uses raw `docker pull`/`docker
# tag` over SSM for the residual oracle/agent box. Nothing in CI or production
# reads `docker-compose.yml`'s `image:` keys — it is a local-development file,
# and #1044 made its refs registry-less so it stays that way.
#
# Required GitHub Variables (or hardcoded below):
#   AWS_ROLE_ARN — arn:aws:iam::037613907429:role/archimedes-github-deploy
#     (also grants ECR push, scoped to repository/archimedes* — see
#     infra/scripts/setup-github-oidc.sh)
#   DEPLOY_ENABLED — gate flag; all three jobs below run ONLY when this repo
#     variable equals 'true'. Unset/false → skipped (neutral, not failed). The
#     stack was rebuilt on a NEW account (037613907429 / us-east-1) and is LIVE
#     again at archimedes-arc.com (2026-06-24), so the deploy target exists. This
#     gate is kept OFF until the migration PR (#716) merges + the OIDC role/trust
#     are confirmed; flip DEPLOY_ENABLED=true (Settings → Secrets and variables →
#     Actions → Variables) to make merges to main auto-build + push + deploy.
#
# ─── KNOWN SECURITY DEBT ───
#
# 1. SECRETS IN SSM COMMAND HISTORY + CLOUDTRAIL — RESOLVED 2026-06-14 (audit #5).
#    Previously GitHub Actions interpolated ${{ secrets.X }} into the SSM command
#    body, leaking the literal values into SSM command history + CloudTrail
#    SendCommand events. Fixed by removing all CI secret injection: the backend
#    now reads LLM_*/EMAIL_ENCRYPTION_KEY from SSM Parameter Store via its EC2
#    instance role at container start (services/secrets_service.load_ssm_secrets,
#    IAM in infra/iam/archimedes-backend-policy.json). The deploy script no longer
#    touches secrets, so no secret value enters any AWS audit surface. The new
#    ECR docker-login below preserves this: it authenticates via the box's own
#    IAM instance role (a short-lived STS-vended token), never a literal
#    secret/password flowing through the SSM command body.
#
# 2. OUT-OF-BAND IAM RESOURCES NOT TERRAFORMED.
#    `archimedes-github-deploy`, `AWSSystemsManagerDefaultEC2InstanceManagementRole`,
#    and the AmazonSSMManagedInstanceCore policy attachment on the EC2 role
#    were created via AWS CLI, not Terraform. Codify in `infra/iam/`
#    follow-up so the IAM state is versioned + recoverable from declarative
#    config.
#
# 3. VERIFY OIDC TRUST POLICY IS LOCKED TO THIS REPO.
#    The role trust policy must restrict token.actions.githubusercontent.com to
#    THIS repository on `:ref:refs/heads/main`. Without that condition, any
#    GitHub repo's Actions can assume the role.
#    The `sub` claim it must match is minted by GitHub in one of two shapes, and
#    this repo currently gets the ID-QUALIFIED one:
#        repo:aprin-labs/archimedes:ref:refs/heads/main                       (plain)
#        repo:aprin-labs@284008417/archimedes@1236816811:ref:refs/heads/main   (id-qualified, current)
#    The role trusts BOTH, so a GitHub-side toggle of that format cannot break
#    deploys; main-only stays the rule. Incident 2026-09-01: after the org
#    rename a-apin -> aprin-labs, a trust policy naming only the plain new name
#    failed every deploy for ~3h with `Not authorized to perform
#    sts:AssumeRoleWithWebIdentity` — the real subject was in CloudTrail, on the
#    failed AssumeRoleWithWebIdentity event, as `userIdentity.userName`.
#    Authoritative prefix:
#      gh api repos/aprin-labs/archimedes/actions/oidc/customization/sub --jq .sub_claim_prefix
#    Verify with: aws iam get-role --role-name archimedes-github-deploy
#    and inspect AssumeRolePolicyDocument's Condition block.
#    After ANY rename/transfer, re-point the role (it is NOT Terraform-managed —
#    infra/scripts/setup-github-oidc.sh is the source of truth):
#      AWS_PROFILE=<admin-profile> bash infra/scripts/setup-github-oidc.sh --apply

name: Build, Push & Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  # QUEUE, never cancel (#1346). With cancel-in-progress: true, every merge to
  # main killed the in-flight run: under a merge cadence faster than the ~13-min
  # build no deploy ever completed (prod ran a stale image while main carried
  # fixes), and a cancel landing in the verify tail AFTER the image deployed
  # left "red run + healthy prod" — a failed-deploy false alarm. With false,
  # the running deploy completes untouched and GitHub keeps at most ONE pending
  # run per group (a newer push replaces the older pending run), so bursts
  # coalesce to latest with strict old-before-new ordering. Deliberately NOT
  # split into a cancellable build phase + queued deploy phase: separate
  # concurrency groups would let run B's migrate interleave into run A's
  # migrate→deploy window, deploying older code against a newer schema.
  #
  # Caveat for incident response: a MANUAL workflow_dispatch (e.g. a rollback)
  # shares this group, so during a merge burst it queues behind the in-flight
  # run and may replace a pending one. If a rollback must jump the line,
  # cancel the in-progress/pending runs in the Actions UI first, then
  # dispatch.
  cancel-in-progress: false

permissions:
  id-token: write   # Required for OIDC token request
  contents: read

env:
  AWS_REGION: us-east-1
  ECR_REGISTRY: 037613907429.dkr.ecr.us-east-1.amazonaws.com
  BACKEND_ECR_REPO: archimedes-backend
  NGINX_ECR_REPO: archimedes-nginx
  AUTH_ECR_REPO: archimedes-auth
  # `EC2_INSTANCE_ID: i-01803d3abc271d39b` was REMOVED here 2026-08-31. It was the
  # single-EC2 Docker-Compose host that the retired SSM `deploy` job targeted; the
  # instance was stopped, snapshotted (snap-02edf9e4a9ac7f201) and its terraform
  # deleted on 2026-08-19 (see infra/main.tf's DECOMMISSIONED block). No job in
  # this file ever read `${{ env.EC2_INSTANCE_ID }}` after the #1039 fast-follow
  # retired that job, so this was dead env naming a dead box — the worst kind of
  # stale reference, because it reads like a live deploy target. The runners that
  # DO run on EC2 today live on a different, separately-provisioned instance
  # (infra/runner_ec2.tf `aws_instance.runner`, resolved by name tag at runtime in
  # .github/workflows/deploy-runners.yml, never hardcoded).
  # How long deploy-ecs will wait for the ECS rollout to reach COMPLETED before
  # it calls the deploy red (issue #1532). This replaces the implicit 600s of
  # `aws ecs wait services-stable` (40 attempts x 15s), which rollout duration
  # had grown into: Önder's table on #1532 shows two runs nine seconds apart —
  # caf8eb0a at 10m10s (red) and 58e337dc at 10m19s (green) — getting opposite
  # verdicts from that stopwatch while both rollouts completed. Sized off the
  # measured 4-10 min range with real headroom, and DELIBERATELY EXPLICIT so
  # that raising it is a decision someone makes with the number in front of
  # them. Exceeding it is still red — this is a budget, not a mute button; the
  # error names the state so "slow" and "broken" stay distinguishable.
  # Raising it past ~24 min also requires raising deploy-ecs's timeout-minutes
  # (the poll step asserts that headroom and fails fast if it is gone).
  DEPLOY_ROLLOUT_BUDGET_SECONDS: 1200

jobs:
  build-and-push:
    name: Build, validate + push to ECR
    # Same gate as `deploy` below — see the header comment. Kept OFF until
    # DEPLOY_ENABLED=true so a stray push to main doesn't start pushing images
    # to an ECR repo that Terraform (issue #1039 chunk 2) hasn't created yet.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30  # torch/sentence-transformers install + model bake + multi-GB ECR push

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Build backend image
        # Build context is the REPO ROOT (issue #1039) so the image can bundle
        # analytics-engine/ + data/corpus + contracts/abis + the committed
        # gmm_model.pkl — assets Fargate can't get from a host volume. The root
        # .dockerignore keeps the context lean (.git / submodules / node_modules).
        # --build-arg GIT_SHA stamps the commit into the image → /health "version"
        # (issue #1039 observability fast-follow).
        run: docker build -t archimedes-backend:ci -f backend/Dockerfile --build-arg GIT_SHA="${{ github.sha }}" .

      - name: Build auth image
        run: docker build -t archimedes-auth:ci auth

      - name: Build nginx image
        # Env-parity fix (PR #1041 correctness pass, 2026-07-07): this is NOT
        # just a boot/smoke validation image — the SAME `:ci`-tagged image
        # built here is tagged + pushed to ECR verbatim below ("Tag + push
        # nginx image"; no separate rebuild happens for the push), and the
        # live deploy target (the Fargate `deploy-ecs` job below) serves
        # whatever landed in ECR — never a locally-rebuilt image. (The second
        # target this comment used to name, the EC2 box's `docker compose
        # pull`, was retired by the Fargate cutover; corrected 2026-08-31,
        # #1044.) Leaving VITE_* build-args at the
        # Dockerfile's empty defaults (the prior state of this step) means
        # the shipped JS bundle has no Circle client key baked in and the
        # wallet / passkey / Circle SDK UI breaks on every real deploy, not
        # just Fargate. `VITE_CIRCLE_CLIENT_KEY` is a Circle TEST client key
        # that ships inside the browser bundle by design (Circle's own docs
        # treat it as public, embeddable config, not a backend secret) — a
        # repo secret or variable is fine for it either way.
        #
        # *** ACTION REQUIRED (Dan): add the `VITE_CIRCLE_CLIENT_KEY` repo
        # secret (Settings → Secrets and variables → Actions → Secrets, repo
        # `aprin-labs/archimedes`) before the first real image build after this
        # PR merges — until then this build-arg resolves to an empty string
        # (same as today) and the wallet UI ships broken. ***
        #
        # `VITE_CIRCLE_CLIENT_URL` falls back to the known default Circle
        # Modular SDK RPC URL (matches `nginx/Dockerfile`'s own ARG default)
        # if the `VITE_CIRCLE_CLIENT_URL` repo VARIABLE is unset — set it
        # explicitly only if Circle ever issues a different endpoint.
        # `VITE_API_BASE` has no fallback here (empty = same-origin API calls,
        # matching the Dockerfile default) — set the `VITE_API_BASE` repo
        # variable only if the frontend must call a different origin.
        env:
          VITE_CIRCLE_CLIENT_KEY: ${{ secrets.VITE_CIRCLE_CLIENT_KEY }}
          VITE_CIRCLE_CLIENT_URL: ${{ vars.VITE_CIRCLE_CLIENT_URL || 'https://modular-sdk.circle.com/v1/rpc/w3s/buidl' }}
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          docker build -t archimedes-nginx:ci -f nginx/Dockerfile . \
            --build-arg VITE_CIRCLE_CLIENT_KEY="$VITE_CIRCLE_CLIENT_KEY" \
            --build-arg VITE_CIRCLE_CLIENT_URL="$VITE_CIRCLE_CLIENT_URL" \
            --build-arg VITE_API_BASE="$VITE_API_BASE"

      - name: Validate backend image boots (GET /health) against a real Postgres
        # Boot the image the way it runs in PROD — against Postgres, not the
        # SQLite fallback. Two reasons the old SQLite boot was wrong: (1) the
        # image runs as `nonroot` and /app is root-owned, so the SQLite default
        # (/app/archimedes_chat.db) can't be created ("unable to open database
        # file") — a latent bug this validation surfaces; (2) SQLite is not the
        # prod path anyway. Stand up a throwaway Postgres on the same
        # user-defined network, apply the schema with the SAME migrate command
        # the Fargate ECS migrate task runs (alembic pre-flight), then boot the
        # backend against it. /health calls get_paper_count(), so the schema
        # must exist first (init_db skips create_all on Postgres — Alembic owns
        # it, #1028). Requiring DATABASE_URL in prod + a writable SQLite
        # fallback for tests/local is tracked in #1044.
        run: |
          set -euo pipefail
          # Idempotent, but ONLY tolerate "already exists": inspect first and
          # create only when the network is missing — so a leftover network
          # from a prior attempt on the same runner doesn't abort the step
          # under `set -e`, while a REAL `docker network create` failure still
          # stops the step with its original error (not swallowed by `|| true`).
          docker network inspect archimedes-ci >/dev/null 2>&1 || docker network create archimedes-ci
          docker run -d --name pg --network archimedes-ci \
            -e POSTGRES_USER=archimedes -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=archimedes \
            postgres:18-alpine
          echo "waiting for Postgres to accept connections..."
          pg_ready=""
          for _ in $(seq 1 30); do
            if docker exec pg pg_isready -U archimedes -d archimedes >/dev/null 2>&1; then pg_ready=1; break; fi
            sleep 2
          done
          # Fail loudly instead of proceeding to a migrate that would surface a
          # harder-to-debug connection error if Postgres never came up.
          if [ -z "$pg_ready" ]; then
            echo "::error::Postgres did not become ready within 60s — see logs below"
            docker logs pg || true
            exit 1
          fi
          DB_URL="postgresql://archimedes:ci@pg:5432/archimedes"
          # Apply the schema exactly as the prod ECS migrate task does (a fresh
          # DB → `alembic upgrade head` from the baseline). Also validates the
          # migrate pre-flight itself, which the real cutover depends on.
          docker run --rm --network archimedes-ci -e DATABASE_URL="$DB_URL" \
            archimedes-backend:ci python -m archimedes.scripts.alembic_migrate_preflight
          docker run -d --name auth --network archimedes-ci \
            -e NODE_ENV=development -e DATABASE_URL="$DB_URL" \
            -e BETTER_AUTH_SECRET='ci-only-better-auth-secret-32-characters' \
            -e BETTER_AUTH_URL='http://localhost:18080' \
            -e BETTER_AUTH_TRUSTED_ORIGINS='http://localhost:18080' \
            archimedes-auth:ci
          docker run -d --name backend --network archimedes-ci -e DATABASE_URL="$DB_URL" \
            -e BETTER_AUTH_INTERNAL_URL='http://auth:3000' \
            -p 8000:8000 archimedes-backend:ci
          ok=""
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::backend image failed to answer GET /health within 120s — see logs below"
            docker logs backend || true
            docker logs pg || true
            exit 1
          fi
          echo "backend /health OK (against Postgres)"

          # Rich-health gate (issue #1039): GET-200 is NOT enough. A strategy-less
          # or gmm-less image still answers 200 while silently degraded — the exact
          # regression that shipped a mock/degraded Fargate build past this step.
          # Assert the IMAGE-BAKED features are live. (risk_data is intentionally
          # NOT asserted here: this throwaway Postgres is empty, so risk_data=mock
          # is correct in CI — it's validated post-deploy against Aurora.)
          HEALTH="$(curl -fsS http://localhost:8000/health)"
          regime="$(printf '%s' "$HEALTH" | jq -r '.regime_detector // "MISSING"')"
          scount="$(printf '%s' "$HEALTH" | jq -r '.strategy_count // "MISSING"')"
          version="$(printf '%s' "$HEALTH" | jq -r '.version // "MISSING"')"
          fail=0
          # Fail CLOSED: require regime == "live". A missing/null/"unknown"/"degraded"
          # value (probe crash OR missing gmm_model.pkl) must NOT slip through on a
          # soft "!= degraded" check.
          if [ "$regime" != "live" ]; then
            echo "::error::rich-health gate: regime_detector='$regime' (expected 'live' — gmm_model.pkl missing from image, or the probe failed)"; fail=1
          fi
          # strategy_count must be a positive integer (MISSING/0/non-numeric all fail).
          if ! printf '%s' "$scount" | grep -qE '^[0-9]+$' || [ "$scount" -le 0 ]; then
            echo "::error::rich-health gate: strategy_count='$scount' (expected > 0 — analytics-engine/strategies missing from image?)"; fail=1
          fi
          # The build passed --build-arg GIT_SHA=<github.sha>, so version MUST be a
          # real SHA here. MISSING/empty/"dev"/"null" means the GIT_SHA build-arg
          # wiring regressed and prod would ship an unstamped image.
          case "$version" in
            ""|MISSING|dev|null)
              echo "::error::rich-health gate: version='$version' (expected the build SHA — GIT_SHA build-arg wiring regressed)"; fail=1 ;;
          esac
          [ "$fail" = 0 ] || exit 1
          echo "rich-health gate OK: regime=$regime strategy_count=$scount version=$version"

      - name: Assert exactly one OpenSSL is mapped in the backend image (#1632)
        # The image is the only place this can be checked honestly: the unit-test
        # runner installs requirements-base.txt, but ONLY the built artifact has
        # the real runtime linkage (libpq5 present, /deps laid out as it ships).
        #
        # Prod died ~10 min after every boot with a bare `Fatal Python error:
        # Aborted` — a raw C abort(), no Python traceback, no glibc/terminate/SSL
        # message. psycopg2-binary vendors its own libssl/libcrypto next to the
        # interpreter's, and two OpenSSL builds in one address space CAN produce
        # that signature — which was the leading hypothesis for #1632 and is now
        # FALSIFIED: prod rev 214 aborted with exactly one OpenSSL mapped, and
        # the faulthandler traceback named two /health corpus-probe threads
        # racing in SQLAlchemy session teardown (fixed by #1740). This step
        # stays because it forecloses the class cheaply, not because it is the
        # #1632 cause. It is also NOT the reason PAPER_ADVANCE_ENABLED is armed
        # today (#1778): that rests on the #1728 process boundary — the tick
        # runs in a child interpreter, so a C abort there cannot take /health.
        # requirements-base.txt now installs source-built
        # psycopg2; this step imports ssl + psycopg2 + aiohttp inside the image
        # and fails the build if /proc/self/maps names two distinct OpenSSLs.
        #
        # Deliberately on the RUNTIME image rather than a lockfile assertion:
        # any future wheel from any dependency can vendor an OpenSSL without the
        # word "psycopg2" appearing anywhere. This catches the class.
        run: docker run --rm archimedes-backend:ci python -m archimedes.scripts.check_single_openssl

      - name: Validate nginx image boots + proxies (GET / and /health)
        # Runs on the same user-defined docker network as the backend
        # container above (container name `backend`, matching nginx.conf's
        # `upstream backend_api { server backend:8000 resolve; }`) so this
        # also exercises the runtime DNS re-resolution path, not just a
        # standalone nginx boot.
        run: |
          set -euo pipefail
          # Docker-network path (a `backend` container on archimedes-ci) → set
          # the Docker-DNS NGINX_* values that render nginx.conf's upstream, same
          # as docker-compose. (Fargate sets the localhost values in ecs.tf.)
          docker run -d --name nginx-validate --network archimedes-ci -p 18080:8080 \
            -e NGINX_ENVSUBST_FILTER='^NGINX_' \
            -e NGINX_RESOLVER_LINE='resolver 127.0.0.11 valid=10s ipv6=off;' \
            -e NGINX_BACKEND_UPSTREAM='backend:8000' \
            -e NGINX_AUTH_UPSTREAM='auth:3000' \
            -e NGINX_UPSTREAM_RESOLVE='resolve' \
            archimedes-nginx:ci
          ok=""
          for _ in $(seq 1 40); do
            if curl -fsS http://localhost:18080/ >/dev/null 2>&1 && curl -fsS http://localhost:18080/health >/dev/null 2>&1; then
              ok=1
              break
            fi
            sleep 3
          done
          if [ -z "$ok" ]; then
            echo "::error::nginx image failed to serve / and proxy /health within 120s — see logs below"
            docker logs nginx-validate || true
            docker logs backend || true
            exit 1
          fi
          curl -fsS http://localhost:18080/api/auth/providers | jq -e '.emailPassword == true' >/dev/null
          # Public browse (rev d of #1194, Dan's ruling): anonymous /app serves the
          # public shell (200) — Explore/Leaderboard/Corpus need no session. The
          # original branch asserted 302-to-sign-in; that design was revised
          # pre-merge. Assert loudly so a mismatch names itself (the silent
          # `test $(curl ...)` form failed with zero output — 4s mystery, once).
          app_code=$(curl -sS -o /dev/null -w '%{http_code}' http://localhost:18080/app)
          if [ "$app_code" != "200" ]; then
            echo "::error::anonymous GET /app returned $app_code, expected 200 (public browse)"; exit 1
          fi
          curl -fsS -c /tmp/auth-cookie -H 'Content-Type: application/json' -H 'Origin: http://localhost:18080' \
            -d '{"name":"CI User","email":"ci@example.com","password":"ci-password-12345"}' \
            http://localhost:18080/api/auth/sign-up/email >/dev/null
          curl -fsS -c /tmp/auth-cookie -H 'Content-Type: application/json' -H 'Origin: http://localhost:18080' \
            -d '{"email":"ci@example.com","password":"ci-password-12345"}' \
            http://localhost:18080/api/auth/sign-in/email >/dev/null
          curl -fsS -b /tmp/auth-cookie http://localhost:18080/app >/dev/null
          echo "nginx public + auth + protected app boundary OK"

      - name: Teardown validation containers
        if: always()
        run: |
          docker rm -f backend auth nginx-validate pg 2>/dev/null || true
          docker network rm archimedes-ci 2>/dev/null || true

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::037613907429:role/archimedes-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd  # v2.1.7

      - name: Verify ECR repositories exist
        # Fails clearly instead of letting `docker push` surface a bare
        # "repository does not exist" AWS API error. The repos are Terraform
        # resources (issue #1039 chunk 2, infra/ecr.tf) not yet applied as of
        # this PR — this is the intended failure mode until Dan runs
        # `terraform apply` in infra/ (see infra/README.md).
        run: |
          set -euo pipefail
          for repo in "$BACKEND_ECR_REPO" "$NGINX_ECR_REPO" "$AUTH_ECR_REPO"; do
            if ! aws ecr describe-repositories --repository-names "$repo" --region "$AWS_REGION" >/dev/null 2>&1; then
              echo "::error::ECR repository '$repo' does not exist yet. Apply the ECR Terraform in infra/ (issue #1039 chunk 2) before enabling DEPLOY_ENABLED — see infra/README.md."
              exit 1
            fi
          done

      - name: Tag + push backend image
        run: |
          set -euo pipefail
          docker tag archimedes-backend:ci "$ECR_REGISTRY/$BACKEND_ECR_REPO:${{ github.sha }}"
          docker tag archimedes-backend:ci "$ECR_REGISTRY/$BACKEND_ECR_REPO:latest"
          docker push "$ECR_REGISTRY/$BACKEND_ECR_REPO:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$BACKEND_ECR_REPO:latest"

      - name: Tag + push nginx image
        run: |
          set -euo pipefail
          docker tag archimedes-nginx:ci "$ECR_REGISTRY/$NGINX_ECR_REPO:${{ github.sha }}"
          docker tag archimedes-nginx:ci "$ECR_REGISTRY/$NGINX_ECR_REPO:latest"
          docker push "$ECR_REGISTRY/$NGINX_ECR_REPO:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$NGINX_ECR_REPO:latest"

      - name: Tag + push auth image
        run: |
          set -euo pipefail
          docker tag archimedes-auth:ci "$ECR_REGISTRY/$AUTH_ECR_REPO:${{ github.sha }}"
          docker tag archimedes-auth:ci "$ECR_REGISTRY/$AUTH_ECR_REPO:latest"
          docker push "$ECR_REGISTRY/$AUTH_ECR_REPO:${{ github.sha }}"
          docker push "$ECR_REGISTRY/$AUTH_ECR_REPO:latest"

  migrate:
    needs: build-and-push
    name: Alembic migrate (pre-rollout, one-off ECS task)
    # Same gate as build-and-push/deploy — see the header comment for why
    # this is one on/off switch for the whole pipeline.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7.0.1

      # Issue #1039 P4 (shared with #1028 Phase A): run `alembic upgrade
      # head` as an ordered, pre-rollout ECS one-off task — BEFORE any new
      # task serves traffic — replacing today's `docker compose exec ...
      # migrate` AFTER `up` race (impossible on Fargate anyway: there is no
      # long-lived box to `exec` into after the fact). As of this PR, #1028
      # Phase A has not landed Alembic yet (backend/migrations/ is
      # hand-rolled timestamped .sql + archimedes.db.init_db()'s idempotent
      # create_all + ADD COLUMN IF NOT EXISTS patches — see that module's
      # docstring). This step detects that and no-ops loudly rather than
      # either (a) failing the whole pipeline on a stage with nothing to do
      # yet, or (b) silently pretending to run a migration that doesn't
      # exist. The moment `backend/alembic.ini` lands on a branch, this
      # activates itself with zero further pipeline changes.
      - name: Check whether Alembic has landed on this branch
        id: check
        run: |
          if [ -f backend/alembic.ini ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "backend/alembic.ini found — running 'alembic upgrade head' as a pre-rollout ECS task."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "NO-OP: backend/alembic.ini not present on this branch yet (#1028 Phase A hasn't landed the migrate stage). Schema changes still land via archimedes.db.init_db()'s idempotent create_all + ADD COLUMN IF NOT EXISTS patches at container startup. Skipping the ECS migrate task cleanly (not a failure)."
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.check.outputs.present == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::037613907429:role/archimedes-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Run `alembic upgrade head` as a one-off Fargate task
        if: steps.check.outputs.present == 'true'
        env:
          # Matches infra/ecs.tf's `${var.project_name}-cluster` with the
          # default `project_name = "archimedes"` (infra/variables.tf) — same
          # literal-constant pattern as ECR_REGISTRY in the top-level env block,
          # not a new cross-job variable.
          ECS_CLUSTER: archimedes-cluster
          # The dedicated one-off migrate task-def family (infra/ecs_migrate.tf,
          # `aws_ecs_task_definition.migrate`, family = "${var.project_name}-migrate")
          # — single container, no nginx sidecar, no healthCheck/dependsOn to
          # stall on while Alembic runs. Kept in sync with Terraform via the
          # `ecs_migrate_task_definition_family` output (infra/outputs.tf);
          # this literal is the CI-side half of that sync contract.
          ECS_MIGRATE_TASK_FAMILY: archimedes-migrate
          # STATIC --network-configuration (issue #1039 B2). Deliberately NOT
          # fetched via `aws ecs describe-services archimedes-backend`: that
          # call can only succeed once `aws_ecs_service.backend` (ecs.tf)
          # already exists, but the migrate task's entire reason to exist is
          # to run BEFORE that service is created — see
          # infra/runbooks/ecs-fargate-cutover.md Phase 1 ("run migrate to
          # exit 0 before the Stage-2 terraform apply that creates the
          # service"). A describe-services-sourced config can therefore never
          # actually satisfy that ordering; it can only ever run after, which
          # was the bug. Sourced instead from `aws_subnet.private` (vpc.tf)
          # + `aws_security_group.ecs_backend` (ecs.tf) — both exist
          # independently of the service. Run `terraform output -raw
          # ecs_migrate_network_configuration` (infra/outputs.tf) after
          # applying those two resources and paste the result here, replacing
          # the REPLACE_WITH_* placeholders below — same literal-constant
          # pattern as ECS_CLUSTER / ECS_MIGRATE_TASK_FAMILY above. The run
          # step below fails closed with a clear error if this still contains
          # a placeholder rather than silently passing an invalid config to
          # `aws ecs run-task`.
          # Real value from `terraform output -raw ecs_migrate_network_configuration`
          # (infra/, after the Fargate cutover apply — issue #1039 B2). Private
          # subnets + the ecs_backend SG, no public IP (migrate reaches Aurora over
          # the VPC). Update if aws_subnet.private / aws_security_group.ecs_backend
          # are ever recreated with new IDs.
          ECS_MIGRATE_NETWORK_CONFIGURATION: '{"awsvpcConfiguration":{"subnets":["subnet-0f412b89a025ca15b","subnet-010efb75b1093ba92"],"securityGroups":["sg-0f21c2773901a14e7"],"assignPublicIp":"DISABLED"}}'
        run: |
          set -euo pipefail

          if [[ "$ECS_MIGRATE_NETWORK_CONFIGURATION" == *REPLACE_WITH_* ]]; then
            echo "::error::ECS_MIGRATE_NETWORK_CONFIGURATION in .github/workflows/deploy.yml still has REPLACE_WITH_* placeholders. Run 'terraform output -raw ecs_migrate_network_configuration' in infra/ (after applying aws_subnet.private + aws_security_group.ecs_backend) and paste the real value in — see infra/runbooks/ecs-fargate-cutover.md Phase 1 (issue #1039 B2)."
            exit 1
          fi

          # Runs `archimedes.scripts.alembic_migrate_preflight`, NOT a bare
          # `python -m alembic upgrade head` (issue #1039 B3 — MANDATORY, see
          # infra/runbooks/ecs-fargate-cutover.md): prod Aurora has no
          # `alembic_version` table today (its schema was built by
          # `create_all()` + hand-rolled ALTER patches, not Alembic), so a
          # bare `upgrade head` against it fails "relation ... already
          # exists" on the baseline revision. The pre-flight script stamps
          # the baseline (`af9c6a9376e4`) first — idempotently, a no-op once
          # `alembic_version` exists — then runs `upgrade head` for real. Uses
          # `python -m` (not the `alembic` console script): backend/Dockerfile
          # installs deps via `pip install --target=/deps` (a PYTHONPATH-based
          # layout, not a real venv/site-packages install), so console-script
          # entry points under /deps/bin are not on PATH; `python -m` resolves
          # purely via PYTHONPATH (already set to /deps:/app in the image).
          #
          # Runs against ECS_MIGRATE_TASK_FAMILY (the dedicated single-
          # container task def, infra/ecs_migrate.tf), using the STATIC
          # ECS_MIGRATE_NETWORK_CONFIGURATION from the env block above — NOT
          # the service's family or a describe-services lookup.
          TASK_ARN=$(aws ecs run-task \
            --cluster "$ECS_CLUSTER" \
            --task-definition "$ECS_MIGRATE_TASK_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "$ECS_MIGRATE_NETWORK_CONFIGURATION" \
            --overrides "{\"containerOverrides\":[{\"name\":\"migrate\",\"command\":[\"python\",\"-m\",\"archimedes.scripts.alembic_migrate_preflight\"]}]}" \
            --query 'tasks[0].taskArn' --output text)

          if [ -z "$TASK_ARN" ] || [ "$TASK_ARN" = "None" ]; then
            echo "::error::ecs run-task did not return a task ARN — see the command output above."
            exit 1
          fi
          echo "Migrate task: $TASK_ARN — waiting for it to stop..."

          aws ecs wait tasks-stopped --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"

          EXIT_CODE=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN" \
            --query 'tasks[0].containers[?name==`migrate`].exitCode | [0]' --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "::error::alembic_migrate_preflight failed (container exit code ${EXIT_CODE}) — see CloudWatch Logs (/archimedes/app, ecs-migrate-* stream) for detail. Blocking deploy: a new task must never serve before schema is current (#1039 acceptance criterion 5)."
            exit 1
          fi
          echo "alembic_migrate_preflight OK — schema is current (stamped + upgraded to head); safe for new tasks to serve."

  deploy-ecs:
    needs: [build-and-push, migrate]
    name: Deploy (ECS Fargate)
    # Issue #1039 C1: CI never redeployed Fargate — build-and-push pushed a
    # fresh image to ECR, but nothing ever pointed the ECS service at it, so
    # every deploy after the Fargate cutover would silently keep serving
    # whatever image tag Terraform bootstrapped the service with. This job
    # is that missing piece: it registers a new task-definition revision
    # carrying this commit's image tags and force-redeploys the service.
    #
    # Same gate + ordering as the EC2 `deploy` job above (needs the same two
    # upstream jobs, same DEPLOY_ENABLED flag, kept explicit here for the
    # same "legible in the Actions UI" reason) — the two deploy targets are
    # independent siblings, not a chain, so a slow/failing EC2 SSM deploy
    # never blocks the ECS redeploy or vice versa. Both currently serve
    # LIVE traffic side by side off the same target group during the
    # EC2-to-Fargate cutover window (see infra/runbooks/ecs-fargate-cutover.md
    # "What `terraform apply` actually does") — every deploy MUST update
    # both, or the two targets silently drift onto different code.
    #
    # Self-activating, same convention as the `migrate` job: `aws_ecs_service.
    # backend` (infra/ecs.tf) is authored but NOT YET APPLIED as of this PR
    # (Stage 2b in the cutover runbook, still Dan's pending AWS operation) —
    # this job detects that with `aws ecs describe-services` and no-ops
    # loudly (clear log line, exit 0) rather than failing every deploy on a
    # service that doesn't exist yet. The moment Stage 2b is applied, this
    # activates itself with zero further pipeline changes.
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    # OUTER stopwatch, and it must stay strictly larger than
    # DEPLOY_ROLLOUT_BUDGET_SECONDS (top-level env) plus the post-rollout probe
    # and the CloudFront invalidation wait — otherwise the job timeout silently
    # becomes the real budget and #1532 returns with a bigger number. 30 min
    # covers the 20-min default budget + the probe + the invalidation wait
    # with margin. The probe is ~35s when the app is healthy and hard-caps its
    # own wall clock at MAX_TOTAL_SECONDS (300s, see
    # .github/scripts/post_rollout_probe.sh). That is a REAL ceiling, not a
    # check between samples: the script starts no request whose deadline
    # reaches past it (curl's --max-time is capped to the remaining budget)
    # and no sleep that runs past it, precisely so retrying transport flakes
    # (#1791) cannot turn a clean ::error into an opaque job timeout — or eat
    # the CloudFront invalidation's share of the reserve below.
    # The poll step asserts this headroom explicitly (see
    # DEPLOY_JOB_TIMEOUT_MINUTES there) rather than trusting the two numbers to
    # be edited together.
    timeout-minutes: 30

    steps:
      # Needed by the task-def rewrite script below. This job historically
      # cloned the live task definition with jq inline and never touched the
      # tree; pinning PAPER_ADVANCE_ENABLED cannot live only in that jq
      # comment — it has to be the same function the unit tests run, in
      # whichever direction the pin currently points.
      - uses: actions/checkout@v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c  # v6.2.3
        with:
          role-to-assume: arn:aws:iam::037613907429:role/archimedes-github-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Check whether the ECS service exists yet
        id: check
        env:
          ECS_CLUSTER: archimedes-cluster
          ECS_SERVICE: archimedes-backend
        run: |
          set -euo pipefail
          STATUS=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
            --query 'services[0].status' --output text 2>/dev/null || echo "")
          if [ "$STATUS" = "ACTIVE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "ECS service '$ECS_SERVICE' is ACTIVE — registering a new task-definition revision and redeploying."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "NO-OP: ECS service '$ECS_SERVICE' not found/ACTIVE in cluster '$ECS_CLUSTER' — the Fargate cutover (infra/runbooks/ecs-fargate-cutover.md Stage 2b) hasn't been applied yet. The EC2 deploy above remains the live path; skipping cleanly (not a failure)."
          fi

      - name: Register a new task-definition revision + force-redeploy the service
        id: redeploy
        if: steps.check.outputs.present == 'true'
        env:
          ECS_CLUSTER: archimedes-cluster
          ECS_SERVICE: archimedes-backend
          # The SERVICE task-def family (infra/ecs.tf's aws_ecs_task_definition.backend,
          # `${var.project_name}-backend`) — distinct from ECS_MIGRATE_TASK_FAMILY
          # above, which boots a single container with no HTTP surface. This one
          # boots nginx, FastAPI, and Better Auth sidecar routed by ALB.
          ECS_TASK_FAMILY: archimedes-backend
        run: |
          set -euo pipefail

          # Fetch the CURRENTLY REGISTERED task definition for this family —
          # not `aws_ecs_task_definition.backend`'s Terraform-authored JSON —
          # so cpu/memory/roles/secrets/log config carry forward. Images are
          # retagged to this commit. PAPER_ADVANCE_ENABLED is pinned HERE, not
          # only in infra/ecs.tf: this job never terraform-applies, so an
          # ecs.tf pin is not live until someone applies. Proven on task-def
          # :211: the #1725 image deployed, the clone had no
          # PAPER_ADVANCE_ENABLED, the then-ON code default started the tick,
          # and /health 502'd at 240s. The value the script pins is "true" as
          # of 2026-09-01 (#1778, the #1632 lift — the tick runs in an
          # isolated child, #1728); pulling it back is PAPER_ADVANCE_VALUE in
          # .github/scripts/ecs_rewrite_task_def.py plus the ecs.tf twin. The
          # code default stays false, so a revision that never heard of the
          # name still cannot tick. terraform apply is still required for
          # other ecs.tf drift; this flag must not depend on it.
          # The same script also ensures the backend container carries the
          # TIINGO_API_TOKEN secret (#1798), for the same reason and against
          # the same drift (#1799): the SSM parameter has existed since
          # 2026-08-31 and no cloned revision has ever carried it.
          aws ecs describe-task-definition --task-definition "$ECS_TASK_FAMILY" \
            --query 'taskDefinition' > current-task-def.json

          jq -e '.containerDefinitions | any(.name == "auth")' current-task-def.json >/dev/null || {
            echo "::error::Current ECS task definition has no auth sidecar. Apply infra/ecs.tf before deploying this release."
            exit 1
          }

          python3 .github/scripts/ecs_rewrite_task_def.py \
            --backend-image "$ECR_REGISTRY/$BACKEND_ECR_REPO:${{ github.sha }}" \
            --nginx-image "$ECR_REGISTRY/$NGINX_ECR_REPO:${{ github.sha }}" \
            --auth-image "$ECR_REGISTRY/$AUTH_ECR_REPO:${{ github.sha }}" \
            current-task-def.json > new-task-def.json

          NEW_TASK_DEF_ARN=$(aws ecs register-task-definition --cli-input-json file://new-task-def.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)

          if [ -z "$NEW_TASK_DEF_ARN" ] || [ "$NEW_TASK_DEF_ARN" = "None" ]; then
            echo "::error::ecs register-task-definition did not return a task definition ARN — see the command output above."
            exit 1
          fi
          echo "Registered $NEW_TASK_DEF_ARN"

          # Handed to the rollout poll below (which needs to know WHICH revision
          # this job deployed, so a circuit-breaker rollback to the previous one
          # is detectable as a rollback rather than read as a clean rollout).
          echo "task_def_arn=$NEW_TASK_DEF_ARN" >> "$GITHUB_OUTPUT"

          # --force-new-deployment: the service's own lifecycle.ignore_changes
          # = [task_definition, desired_count] (infra/ecs.tf) means Terraform
          # never reverts this out-of-band update on a later apply.
          aws ecs update-service --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --task-definition "$NEW_TASK_DEF_ARN" --force-new-deployment >/dev/null
          echo "Redeploy requested — the rollout verdict is the next step's job."

      - name: Poll the ECS rollout to an explicit verdict
        id: rollout
        if: steps.check.outputs.present == 'true'
        # Issue #1532. REPLACES `aws ecs wait services-stable`, which measured
        # the wrong thing: its default budget is 40 attempts x 15s = 600s, with
        # no override at the call site, and rollout duration had grown to
        # straddle it. Two runs nine seconds apart got opposite verdicts
        # (caf8eb0a 10m10s red, 58e337dc 10m19s green) while BOTH rollouts
        # completed and the circuit breaker fired on neither. A check that
        # cannot tell "slow" from "broken" is a check being trusted for
        # something it does not measure.
        #
        # What this reads instead — the service's own verdict, every 15s:
        #   rolloutState == COMPLETED  -> green, however long it took
        #   rolloutState == FAILED     -> red, naming rolloutStateReason
        #   circuit-breaker rollback   -> red, naming it as a rollback
        #   budget exhausted           -> red, naming the state it was stuck in
        # so a slow-but-good rollout and a bad revision no longer produce the
        # same red, and neither produces a green.
        #
        # Rollback is detected two ways because ECS writes it in two places: the
        # failing deployment's rolloutStateReason says "rolling back...", and a
        # NEW PRIMARY deployment appears carrying the PREVIOUS task definition.
        # The task-definition comparison is the load-bearing one — it holds even
        # if AWS rewords the reason string. Both are checked across ALL
        # deployments, not just the first, because the failing deployment is not
        # necessarily the PRIMARY one by the time the rollback lands.
        #
        # NOT `continue-on-error` and NOT a raised-then-ignored budget: exceeding
        # the budget is still a hard red (#1532 anti-goal 1 — fail-soft here
        # would convert a real failure into silence).
        env:
          ECS_CLUSTER: archimedes-cluster
          ECS_SERVICE: archimedes-backend
          NEW_TASK_DEF_ARN: ${{ steps.redeploy.outputs.task_def_arn }}
          # The job's `timeout-minutes:` above, restated so the script can prove
          # the budget actually fits inside it. Keep the two in sync — if they
          # drift, this step fails loudly at second 0 instead of the job dying
          # mid-rollout at the outer timeout with no verdict at all.
          DEPLOY_JOB_TIMEOUT_MINUTES: 30
        run: |
          set -euo pipefail

          BUDGET="${DEPLOY_ROLLOUT_BUDGET_SECONDS:-1200}"
          POLL_INTERVAL=15

          if ! printf '%s' "$BUDGET" | grep -qE '^[0-9]+$' || [ "$BUDGET" -le 0 ]; then
            echo "::error::DEPLOY_ROLLOUT_BUDGET_SECONDS='$BUDGET' is not a positive integer number of seconds (set it in the workflow env block of .github/workflows/deploy.yml)."
            exit 1
          fi

          # A budget larger than the job's own timeout is fiction: the outer
          # timeout would kill the job first, with no verdict — exactly #1532's
          # bug wearing a bigger number. Reserve 7 min for the post-rollout
          # probe + the CloudFront invalidation wait that follow this step.
          # The probe can consume at most MAX_TOTAL_SECONDS=300s of that 420s
          # (a hard wall-clock ceiling, see .github/scripts/post_rollout_probe.sh);
          # the rest is the invalidation wait's, and a test asserts the probe's
          # ceiling stays strictly smaller than this reserve.
          JOB_TIMEOUT_SECONDS=$(( DEPLOY_JOB_TIMEOUT_MINUTES * 60 ))
          if [ "$BUDGET" -gt $(( JOB_TIMEOUT_SECONDS - 420 )) ]; then
            echo "::error::DEPLOY_ROLLOUT_BUDGET_SECONDS=${BUDGET}s leaves under 7 minutes of the deploy-ecs job's ${DEPLOY_JOB_TIMEOUT_MINUTES}-minute timeout for the answer probe and the CloudFront invalidation. Raise timeout-minutes on the deploy-ecs job (and DEPLOY_JOB_TIMEOUT_MINUTES here) alongside the budget."
            exit 1
          fi

          if [ -z "$NEW_TASK_DEF_ARN" ] || [ "$NEW_TASK_DEF_ARN" = "None" ]; then
            echo "::error::no task-definition ARN was handed over from the redeploy step — cannot tell a completed rollout from a circuit-breaker rollback without it."
            exit 1
          fi

          echo "Polling $ECS_SERVICE every ${POLL_INTERVAL}s for up to ${BUDGET}s; target revision $NEW_TASK_DEF_ARN"
          START=$(date +%s)

          while :; do
            NOW=$(date +%s)
            ELAPSED=$(( NOW - START ))

            DEPLOYMENTS="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query 'services[0].deployments' --output json)"

            # The PRIMARY deployment is the one this job is waiting on. ECS puts
            # it first in the array, but select on status rather than trusting
            # that: the ACTIVE (draining) deployment alongside it reports its own
            # rolloutState of COMPLETED, so reading position 0 blindly can read a
            # COMPLETED off the OLD deployment. Falls back to position 0 if no
            # PRIMARY is present.
            PRIMARY="$(printf '%s' "$DEPLOYMENTS" | jq -c '(map(select(.status == "PRIMARY")) + .)[0] // {}')"
            STATE="$(printf '%s' "$PRIMARY" | jq -r '.rolloutState // "UNKNOWN"')"
            REASON="$(printf '%s' "$PRIMARY" | jq -r '.rolloutStateReason // ""')"
            PRIMARY_TD="$(printf '%s' "$PRIMARY" | jq -r '.taskDefinition // ""')"
            FAILED_TASKS="$(printf '%s' "$PRIMARY" | jq -r '.failedTasks // 0')"
            RUNNING="$(printf '%s' "$PRIMARY" | jq -r '.runningCount // 0')"
            DESIRED="$(printf '%s' "$PRIMARY" | jq -r '.desiredCount // 0')"

            # Elapsed on every line: the log itself becomes the record of how
            # long rollouts actually take, so the next budget change is made off
            # measurements instead of a guess (this is the number #1532 had to
            # reconstruct from job durations after the fact).
            printf '[%4ds / %ss] rolloutState=%-11s tasks=%s/%s failed=%s :: %s\n' \
              "$ELAPSED" "$BUDGET" "$STATE" "$RUNNING" "$DESIRED" "$FAILED_TASKS" "$REASON"

            # 1. Any deployment FAILED — the revision is bad, not slow.
            FAILED_REASON="$(printf '%s' "$DEPLOYMENTS" | jq -r 'map(select(.rolloutState == "FAILED")) | .[0].rolloutStateReason // ""')"
            if [ -n "$FAILED_REASON" ]; then
              echo "::error::ECS rollout FAILED after ${ELAPSED}s — reason: ${FAILED_REASON} (failedTasks=${FAILED_TASKS}). This is a bad revision, not a slow one: the deployment circuit breaker (infra/ecs.tf) judged the new tasks unhealthy. Check the ecs-backend CloudWatch log stream for the container's own error."
              exit 1
            fi

            # 2. Circuit-breaker rollback named in any deployment's reason.
            ROLLBACK_REASON="$(printf '%s' "$DEPLOYMENTS" | jq -r '[.[] | .rolloutStateReason // ""] | map(select(test("roll(ing|ed)? ?back"; "i"))) | .[0] // ""')"
            if [ -n "$ROLLBACK_REASON" ]; then
              echo "::error::ECS circuit breaker rolled the deployment back after ${ELAPSED}s — reason: ${ROLLBACK_REASON}. Prod is back on the PREVIOUS revision; ${NEW_TASK_DEF_ARN} is NOT serving."
              exit 1
            fi

            # 3. PRIMARY reverted to another revision — the rollback the reason
            #    string above may not have spelled out, and also the case where
            #    something else redeployed over this job's revision.
            if [ -n "$PRIMARY_TD" ] && [ "$PRIMARY_TD" != "$NEW_TASK_DEF_ARN" ]; then
              echo "::error::the PRIMARY ECS deployment is on ${PRIMARY_TD}, not the revision this job registered (${NEW_TASK_DEF_ARN}), after ${ELAPSED}s — a circuit-breaker rollback to the previous task definition, or another deploy superseded this one. Either way this job's image is not what prod is serving."
              exit 1
            fi

            # 4. Done. However long it took.
            if [ "$STATE" = "COMPLETED" ]; then
              echo "rollout=completed" >> "$GITHUB_OUTPUT"
              echo "ECS rollout COMPLETED in ${ELAPSED}s on ${NEW_TASK_DEF_ARN} (budget ${BUDGET}s). Slow is not broken; this is green."
              break
            fi

            # 5. Budget exhausted. Checked AFTER the verdicts above so a rollout
            #    that completes on the last poll still counts.
            if [ "$ELAPSED" -ge "$BUDGET" ]; then
              echo "::error::ECS rollout budget exceeded, state=${STATE} after ${ELAPSED}s (budget ${BUDGET}s, failedTasks=${FAILED_TASKS}, reason: ${REASON}) — raise the budget if rollouts have legitimately grown (DEPLOY_ROLLOUT_BUDGET_SECONDS in the workflow env block, and deploy-ecs's timeout-minutes with it). The circuit breaker has NOT failed this deployment; it may still complete after this job gives up, so check the service before assuming prod is on the old image."
              exit 1
            fi

            sleep "$POLL_INTERVAL"
          done

      - name: Assert the deployed app actually answers (post-rollout probe)
        if: steps.rollout.outputs.rollout == 'completed'
        # Issue #1532, Önder's second comment — the half that polling
        # rolloutState does NOT fix. After 58e337dc's job reported success,
        # /health and /api/config/contracts returned nothing inside a 12-15s
        # client budget; a 60s probe got 200 in 31.2s, already on the new
        # version, then settled to ~1.2s. rolloutState was COMPLETED throughout.
        # "ECS is content" and "the app answers inside a client's deadline" are
        # different claims, and only the first one was ever being checked.
        #
        # Probes /api/* deliberately: infra/cloudfront.tf puts /api/* on the
        # AWS-managed CachingDisabled policy, so every sample here is an origin
        # round trip. ("/" would be useless — it is CloudFront-cached static
        # content and kept returning 200 in ~0.3s through the whole outage
        # window. Static fast + API timing out is what identified the origin as
        # the culprit in the first place.)
        #
        # The verdict is "NEED_STREAK consecutive good samples were OBSERVED
        # somewhere in the window AND the final (post-retry) sample is good
        # AND it reports this commit AND no more than MAX_NOT_OK samples were
        # NOT-OK". It was "the LAST 5 samples", and #1791 shows what that
        # cost: two of
        # the last four main deploys went red on a single transport transient
        # (curl exit 28 at 15.0s; curl exit 35 — a TLS reset — at 25 ms) while
        # prod was already serving the expected version. The "final sample must
        # be good" half is what keeps this fail-closed: a cold-start tail —
        # slow-then-fast, the #1532 shape this step exists for — still fails,
        # because a window that is broken AT THE END fails no matter how
        # healthy its start was. MAX_NOT_OK is the other half of that: the
        # observed-streak rule ALONE would tolerate 4 bad samples out of 10
        # (SAMPLES - NEED_STREAK - 1), so the cap is what keeps "one transient
        # does not fail a healthy deploy" from becoming "a pockmarked window
        # passes". Two NOT-OK samples pass with a ::warning; three go red.
        # ONLY transport-level failures (no HTTP answer at all, http=000 —
        # connect/DNS/TLS/client timeout) are retried. Anything the app
        # answered is never retried, INCLUDING a 5xx that was truncated
        # mid-body (curl exits non-zero there while reporting a real 503):
        # #1714/#1713's rollout-window 503s have to stay visible.
        #
        # The 5s ceiling is a client-realistic deadline, not a generous one:
        # it is below #1436's recorded p99 of 16.8s on
        # purpose. If this step turns out to be the flakiest thing in the
        # pipeline for reasons OTHER than transport flakes, that is a finding
        # about the app's post-rollout latency (#1309, #1436), not a reason to
        # loosen the number.
        env:
          # Through CloudFront and the ALB, exactly as a user reaches it —
          # not the ECS task's own container health check, which is what
          # rolloutState already reflects.
          HEALTH_URL: https://archimedes-arc.com/api/health
          # Same value the build-and-push job baked into the image via
          # --build-arg GIT_SHA and tagged into ECR, and the same tag the
          # redeploy step wrote into the task definition. If /api/health reports
          # anything else, something other than this commit is serving.
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          # `set +e` is load-bearing: GitHub runs `run:` under `bash -e`, and
          # `sample="$(curl ...)"` inside the probe is an assignment whose exit
          # status IS curl's. With -e in force a single timed-out sample (curl
          # exit 28) aborted this whole step before `rc=$?` ran and before a
          # single `probe N/10` line was printed — the 2026-09-01 run
          # 33553292497 went red that way with the rollout COMPLETED; the step
          # never got to measure whether the app was answering. The script sets
          # the same `set +e -uo pipefail` for itself and handles every failure
          # explicitly; this line keeps the step shell honest too.
          set +e -uo pipefail

          # The probe body lives in a script, not inline here, so
          # backend/tests/test_post_rollout_probe.py can run THE EXACT SCRIPT
          # THIS STEP RUNS against a fake /api/health (transport reset, 5xx,
          # slow 200, wrong version) instead of a paraphrase that drifts.
          # SAMPLES / NEED_STREAK / MAX_SECONDS / INTERVAL / TRANSPORT_RETRIES /
          # RETRY_PAUSE default to 10 / 5 / 5s / 3s / 2 / 3s inside the script,
          # alongside MAX_NOT_OK=2 (most NOT-OK samples a passing run may
          # contain), CURL_MAX_TIME=15s and MAX_TOTAL_SECONDS=300s; they are
          # documented and tested there.
          bash .github/scripts/post_rollout_probe.sh

      - name: Invalidate CloudFront (unhashed SPA entry points only)
        # Gated on the ROLLOUT VERDICT, not on job success (issue #1532). The
        # old `if: steps.check.outputs.present == 'true'` inherited GitHub's
        # implicit success(), so any earlier failure skipped this step — which
        # meant a rollout that had ALREADY put new hashed /assets/* filenames
        # into prod could leave CloudFront serving the old index.html that
        # references the deleted ones. That coupling was accidental, and it
        # fired for real: both #1532 waiter timeouts skipped this invalidation
        # while the new image was serving. `!cancelled()` is what suppresses the
        # implicit success(); the condition is now exactly "the new content is
        # live at the origin", which is precisely when the edge must be purged.
        # It deliberately still does NOT run when the rollout failed or rolled
        # back — prod is on the old image then, and the old cached HTML is the
        # correct thing to be serving.
        if: ${{ !cancelled() && steps.rollout.outputs.rollout == 'completed' }}
        #
        # WHY THIS STEP EXISTS: CloudFront caches "/" and "/index.html" for 60s
        # (infra/cloudfront.tf's aws_cloudfront_cache_policy.html, the
        # default_cache_behavior). Without an invalidation, CloudFront keeps
        # serving the OLD cached index.html — which <script>/<link> references
        # the OLD build's hashed JS/CSS filenames — for up to that TTL after
        # every deploy. Those old files no longer exist in the new ECS task's
        # image, so the served page 404s on its own asset tags until the TTL
        # rolls over: a blank-page window on every merge to main, not a
        # one-off. (`git grep -nE "cloudfront|create-invalidation" --
        # .github/workflows/` returned nothing before this PR.)
        #
        # PATHS ARE DELIBERATELY NARROW, not "/*": "/*" would invalidate every
        # cached object indiscriminately, including the content-addressed,
        # immutable /assets/* objects (a new build never reuses an old
        # filename, so invalidating them buys zero correctness benefit) —
        # explicitly NOT done here. Instead, three paths cover exactly the
        # unhashed SPA entry points nginx actually serves unhashed
        # (nginx/nginx.conf's `location /` + `try_files $uri $uri/
        # /index.html`), INCLUDING their query-string cache-key variants:
        #   "/"             — the bare root, no query string
        #   "/?*"           — root with ANY query string (e.g. "/?utm=...")
        #   "/index.html*"  — "/index.html" bare AND with any query string
        #                     (a trailing "*" matches the empty suffix too,
        #                     so this one pattern covers both)
        # This is required because infra/cloudfront.tf's html cache policy
        # sets query_string_behavior = "all" — every distinct query string is
        # a DISTINCT cache entry, and CloudFront invalidation paths are
        # exact-match unless wildcarded (AWS docs: "If you configured
        # CloudFront to cache based on query string parameters... to
        # invalidate all versions of the file regardless of query string
        # values, use the * wildcard, e.g. /images/image.jpg*"). The earlier
        # "/" + "/index.html" (no wildcards) version of this step left
        # "/?utm=..." and "/index.html?x=1" — routine marketing/tracking
        # links — serving stale cached HTML for the full 60s TTL after every
        # deploy.
        #
        # COST: each path — wildcarded or literal — counts as exactly ONE
        # path against CloudFront's 1,000-paths/month free tier (a wildcard
        # does not cost more than a literal). Going from 2 paths to 3 is
        # free; at one invalidation per deploy, hundreds of deploys/month
        # would still be needed to approach the free-tier ceiling.
        #
        # RESIDUAL: a user who deep-links directly to a client-routed SPA path
        # (e.g. "/generate") between deploy and invalidation can still get a
        # stale cached copy of that specific path for up to the same 60s TTL —
        # CloudFront caches each distinct URI separately under the same html
        # cache policy, and enumerating every SPA route here isn't practical.
        # That residual self-heals within the TTL either way; it is not the
        # outage this step targets (which is the durable multi-minute+ staleness
        # window "/" itself would otherwise sit in with no invalidation at all).
        #
        # IAM: needs cloudfront:CreateInvalidation + GetInvalidation on this
        # distribution — granted via infra/cloudfront.tf's
        # aws_iam_role_policy.github_deploy_cloudfront (added in the same PR
        # as this step). GetInvalidation is actually used below (`aws
        # cloudfront wait invalidation-completed`, which polls
        # GetInvalidation under the hood) so the deploy job confirms the
        # cache purge really completed instead of firing the API call and
        # immediately moving on. That grant is INERT until Dan runs
        # `terraform apply` in infra/ — until then this step logs a clear
        # warning and exits 0 rather than failing the deploy (an ECS deploy
        # that already succeeded and is serving traffic must not be marked
        # failed over a CDN cache purge — see the explicit `set +e` and the
        # exit-code handling below; the completion wait is likewise
        # non-fatal on timeout).
        env:
          # Literal constant, same pattern as ECR_REGISTRY (top-level env
          # block above) / ECS_CLUSTER / ECS_MIGRATE_TASK_FAMILY (this job's
          # sibling steps): sourced from infra/cloudfront.tf's
          # aws_cloudfront_distribution.main, output as `cloudfront_distribution_id`
          # (infra/outputs.tf). Not read from a GitHub variable/secret because
          # none exists for it today — this literal is the CI-side half of
          # that sync contract, same as the other hardcoded infra ids in this
          # file. Update if the distribution is ever recreated with a new id
          # (`terraform output -raw cloudfront_distribution_id`).
          CLOUDFRONT_DISTRIBUTION_ID: E34KG22GWPO075
        run: |
          # `set +e` is load-bearing here too (same class as the post-rollout probe):
          # GitHub runs this under `bash -e`, and `OUTPUT="$(aws ...)"` is an assignment
          # whose exit status is the CLI's, so a failed invalidation aborted the step
          # BEFORE `RC=$?` and the deliberately non-fatal warning path below could run —
          # turning a cache-purge hiccup into a red deploy that was already serving.
          set +e -uo pipefail
          OUTPUT="$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/" "/?*" "/index.html*" 2>&1)"
          RC=$?
          if [ $RC -ne 0 ]; then
            echo "::warning::CloudFront invalidation failed (aws cli exit $RC) — the ECS deploy above already succeeded and IS serving the new image; this does not fail the deploy. Stale HTML self-heals within the html cache policy's 60s TTL either way. Likely cause if this is an authorization error: infra/cloudfront.tf's aws_iam_role_policy.github_deploy_cloudfront grant has not been terraform-applied yet — Dan needs to run 'terraform apply' in infra/. Raw output:"
            echo "$OUTPUT"
            exit 0
          fi
          echo "$OUTPUT"
          INVALIDATION_ID="$(printf '%s' "$OUTPUT" | jq -r '.Invalidation.Id // empty')"
          if [ -z "$INVALIDATION_ID" ]; then
            echo "::warning::CloudFront invalidation was created for distribution $CLOUDFRONT_DISTRIBUTION_ID but its Id could not be parsed from the CLI output above — skipping the completion wait (this does not fail the deploy)."
            exit 0
          fi
          echo "CloudFront invalidation $INVALIDATION_ID created for distribution $CLOUDFRONT_DISTRIBUTION_ID (paths: / , /?* , /index.html*). Waiting for it to complete..."
          if aws cloudfront wait invalidation-completed --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" --id "$INVALIDATION_ID"; then
            echo "CloudFront invalidation $INVALIDATION_ID completed — the edge no longer serves the stale cached HTML."
          else
            echo "::warning::CloudFront invalidation $INVALIDATION_ID did not report completion within the CLI waiter's timeout — the ECS deploy above already succeeded and IS serving the new image; this does not fail the deploy. Check status manually: aws cloudfront get-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --id $INVALIDATION_ID"
          fi
