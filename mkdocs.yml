# Archimedes docs site — mkdocs-material config.
#
# The built site is served from our own S3 + CloudFront at the site_url below
# (docs-site/infra/main.tf, issue #1634 — not GitHub Pages). See
# docs/runbooks/docs-site-setup.md for the apply/publish/rollback procedure and
# .github/workflows/docs-site.yml for the jobs: the build runs on every
# docs-path push and PR, the publish runs on pushes to main.
#
# site_url is the canonical host and is not free to drift: ui/test/docs-link.test.js
# asserts the product's Docs links point at the same host.
#
# ═══════════════════════════════════════════════════════════════════════════
# THE NAV IS THE ALLOW-LIST. PUBLICATION IS DEFAULT-DENY (#1751).
#
# Removing a page from the nav used not to take it off the site: six pages with
# no nav entry were verified returning HTTP 200 on 2026-09-01, and /robots.txt
# is 404, so all of it was crawlable. `exclude_docs` fixed that page by page —
# a deny-list, which only ever catches the files someone already thought of, so
# a NEW docs/runbooks/*.md or docs/api/*.md published the day it was committed.
#
# It is inverted now. `.github/scripts/mkdocs_hooks.py` (`deny_unlisted`) keeps a
# file under docs/ only if THIS nav names it or `not_in_nav` allow-lists it, and
# marks everything else excluded — off the site — with a WARNING that
# `mkdocs build --strict` fails on. So the three publication controls are:
#
#   nav:           publishes a page, and lists it.
#   not_in_nav:    publishes a file without a nav entry (the site's own assets).
#   exclude_docs:  states that a file is internal — it is never built.
#
# A file in none of the three does not publish, and turns the build red until
# somebody says which of the three it is.
#
# Nav LABELS are the product's language; the PATHS under them are unchanged.
# docs/CONVENTIONS.md § 2 — "The slug is a stable identifier — other docs, ADRs,
# and PR descriptions link to it." A rename here is a label change, never a
# `git mv`, so no inbound link in the repo or on GitHub breaks.
# ═══════════════════════════════════════════════════════════════════════════

site_name: Archimedes
site_url: https://docs.archimedes-arc.com
# One sentence, and it is the identity line: it fills <meta name="description">
# and is what every Slack/X/Discord unfurl of this site shows. The head carried
# only charset/viewport/generator before, so every unfurl was a bare "Archimedes".
site_description: "Portfolio strategy, under scrutiny — research, rigor, proof. How Archimedes generates strategies, gates them, and shows the work."
repo_url: https://github.com/aprin-labs/archimedes
repo_name: aprin-labs/archimedes
edit_uri: edit/main/docs/
copyright: "© 2026 Aprin Labs — the Unlicense (public domain)."

docs_dir: docs

theme:
  name: material
  # Only the 404 page is overridden — see docs-site/overrides/404.html. This PR
  # takes ~90 URLs off the site, so the page a stale link lands on has to say
  # where the content went instead of rendering a bare "404 - Not found".
  custom_dir: docs-site/overrides
  logo: assets/logo.svg
  favicon: assets/favicon.png
  # Matches the product surface (ui/src/App.css § .public-site: --sans is
  # "IBM Plex Sans", --mono is "IBM Plex Mono"), so the docs and the app read as
  # one surface rather than as a stock theme parked next to a designed product.
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      # Near-black chrome + the product's gold accent (ui/src/App.css
      # --canvas #09090b, --accent #d4a853). Default indigo is the visual tell
      # that nobody configured the theme.
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: amber
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    # Seven top-level sections move into the header instead of stacking in one
    # vertical rail; the left rail then shows only the section you are in.
    - navigation.tabs
    - navigation.tabs.sticky
    # Second-level groups render as headed blocks rather than another accordion.
    - navigation.sections
    # Without this the whole tree is inlined into every page — the live
    # /index.html was 141,005 bytes on 2026-09-01, mostly repeated sidebar.
    - navigation.prune
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - content.action.view

# `search` is mkdocs' default, but the key stops defaulting the moment it is
# declared — so it must be listed explicitly beside the second plugin.
#
# git-revision-date-localized replaces a hand-typed freshness stamp with a real
# one: docs/README.md carried "Last rebuilt 2026-07-28" in body prose while the
# site itself was current. `fallback_to_build_date: false` is the honest
# setting — a page with no git history gets no date rather than today's.
# It needs full history: .github/workflows/docs-site.yml checks out with
# `fetch-depth: 0` for this reason.
plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: false

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  # superfences REPLACES fenced_code. It is the only change that turns nine
  # pages of raw grey ```mermaid text into diagrams — verified broken before
  # this: the built architectural-principles page emitted
  # `<pre><code class="language-mermaid">`. mkdocs-material bundles the mermaid
  # runtime for exactly this fence config, so no extra_javascript is needed.
  #
  # The `!!python/name:` tag is mkdocs-material's documented way to name the
  # formatter. `yaml.safe_load` cannot construct it, so the two suites that
  # parse this file (backend/tests/test_docs_site.py,
  # backend/tests/test_local_mode_contract.py) load it with a SafeLoader that
  # tolerates the tag. ui/test/docs-link.test.js reads site_url by regex and is
  # unaffected.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: material/web
      link: https://archimedes-arc.com
      name: The live product — Arc public testnet
    - icon: fontawesome/brands/github
      link: https://github.com/aprin-labs/archimedes
      name: Source on GitHub — the Unlicense

# Build hooks — see the module docstring for the full reasoning.
#   1. mounts the agent-generated openwiki/ tree (it lives outside docs_dir,
#      so mkdocs cannot see it on its own);
#   2. rewrites, at build time only, the relative links that point out of
#      docs_dir (../CLAUDE.md, backend/..., contracts/...) to GitHub blob
#      URLs. Those links are correct on GitHub and are already gated there by
#      docs-gate.yml's docs_links.py; they simply cannot resolve inside a site
#      rooted at docs/. Committed markdown is never modified.
#   3. fixes the edit pencil for the mounted openwiki/ pages, whose source is
#      NOT under docs/ and whose edit_uri-derived URL therefore 404s.
hooks:
  - .github/scripts/mkdocs_hooks.py

# `mkdocs serve` watches docs_dir and this file and nothing else, so an edit
# under openwiki/ would not live-reload without this. (The hook itself is
# loaded once per process — mkdocs lru_caches it — so editing that file still
# needs a restart, not just a rebuild.)
watch:
  - openwiki

# `mkdocs build --strict` is the build command (here and in
# .github/workflows/docs-site.yml), and it is clean. It was previously
# rejected because ~300 WARNINGs were produced by correct out-of-docs_dir
# links; the hook above removes that entire class by repointing them at
# GitHub instead of at nothing, so the remaining WARNING budget is zero and
# --strict is a real gate: a link into docs/ or openwiki/ that names a file
# which does not exist now fails the build. The hook deliberately does NOT
# rewrite that case — see docs/runbooks/docs-site-setup.md
# § "mkdocs --strict is the gate".

