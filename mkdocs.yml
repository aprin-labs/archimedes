# ═══════════════════════════════════════════════════════════════════════════
# exclude_docs — THIS is what takes a page off the site. Nav removal does not.
#
# Verified live 2026-09-01: /team/, /operations/feature-flag-fliplist/,
# /runbooks/cost-kill-switch/, /sprint/, /api/admin-private/ and
# /database-relations/ all returned HTTP 200 with no nav entry.
#
# A link INTO an excluded page is not left dangling: .github/scripts/mkdocs_hooks.py
# repoints it at the GitHub blob URL for the file, the same way it treats any
# other path the site does not serve. So excluding a page does not break the
# pages that cite it, and `mkdocs build --strict` stays clean.
#
# Port each file to the private docs repo FIRST, delete here second, and name
# where it went in the deletion commit — docs/CONVENTIONS.md § Content routing,
# whose test is "would we be comfortable if a competitor read this?".
# docs/archive/README.md records the 2026-08-19 precedent for that port.
#
# This block is no longer the only thing between a file and the public site —
# `deny_unlisted` is (see the banner at the top of this file). It stays, and
# stays exact, because "off the site" and "recorded as internal" are different
# claims: a page that is merely absent from the nav is one careless nav row away
# from being public again, and a reviewer reading this block can see what was
# decided about each one.
# ═══════════════════════════════════════════════════════════════════════════
exclude_docs: |
  # The site's own pinned toolchain. It lives under docs/ so the workflow and
  # the runbook install one file, but it is a build input, not a page.
  requirements.txt

  # ── Directories that are internal by kind. Globs, not file lists, so a new
  #    sprint card or handover next month is excluded automatically.
  archive/**
  audits/**
  benchmarks/**
  decisions/**
  handovers/**
  operations/**
  prompts/**
  research/**
  sprint/**

  # ── Individually internal pages. One pattern per line, and NOTHING after it:
  #    these are gitignore-style patterns, where a trailing `# comment` is part
  #    of the pattern and silently matches no file. (Caught by diffing the built
  #    URL set against the live one — `team/` was still being published.)
  #
  # PII: ages, cities, Discord handles, timezones
  team.md
  # Retired branding at :23 and :49
  demo-script-lepton.md
  # Vendor cost comparison — competitor-readable
  infrastructure-provider-analysis.md
  analysis/insights-analytics-gap-2026-08-31.md
  adr/aws-account-migration.md
  adr/lambda-generation-offload.md
  # Names a competitor
  plans/2026-08-23-phantom-inspired-public-landing.md
  plans/2026-08-30-relations-phase2.md
  # Retired branding at :432, :916, :976
  plans/spine-plus-v2-plan.md
  # Retired branding at :261; internal walkthrough
  runbooks/spec-1-walkthrough.md
  runbooks/backtest-results-retention.md
  # AWS spend brake, thresholds, recovery command
  runbooks/cost-kill-switch.md
  # The six findings gating EMAIL_VERIFICATION_ENFORCED
  runbooks/email-verification-validation.md
  runbooks/erc8004-identity-registration.md
  runbooks/runner-ec2-wedge.md
  # Landed after the audit's tree snapshot: an `infra/apply.sh` procedure that
  # names the distribution and its rollback. Same class as the two runbooks
  # above, so it is off the site for the same reason.
  runbooks/cloudfront-cache-behaviour-apply.md
  # Same class again, landed 2026-09-03. Both name the AWS account number and a
