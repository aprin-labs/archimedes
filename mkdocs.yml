# ═══════════════════════════════════════════════════════════════════════════
# not_in_nav — the explicit allow-list for files that publish WITHOUT a nav row.
#
# Under default-deny (#1751) this is the only other way onto the site, so it is
# deliberately short and deliberately extension-scoped: these are the site's own
# assets, referenced from inside pages (the logo, the favicon, the two rendered
# diagrams and the mermaid source one of them is generated from). A `**` glob
# here would re-open the hole this closes — `reference/**` would silently
# publish a future `docs/reference/internal-notes.md` with no nav entry and no
# review — so every pattern names a non-page file type.
#
# mkdocs' own use of this key is narrower (it suppresses the "exists but is not
# in the nav" message for documentation pages, and media files never produce
# that message). `deny_unlisted` reads the same patterns, which is what makes
# them an allow-list rather than a comment.
# ═══════════════════════════════════════════════════════════════════════════
not_in_nav: |
  assets/*.png
  assets/*.svg
  reference/*.svg
  reference/*.mmd

# The backstop for "somebody deleted the hook". `deny_unlisted` normally marks an
# unlisted page excluded before mkdocs ever looks at the nav, so this level is not
# what fires day to day. Without the hook it is: mkdocs logs every documentation
# page that is in no nav and no `not_in_nav` at this level, and the docs-site
# workflow builds with `--strict`, which fails on WARNING. `warn` is the strictest
# value mkdocs accepts here (mkdocs/config/defaults.py `_LogLevel`: warn/info/
# ignore); the default is `info`, which --strict ignores — that default is half
# the reason a page could be published by nobody in the first place.
validation:
  nav:
    omitted_files: warn
