[project]
name = "archimedes-mcp"
version = "0.1.0"
description = "MCP server for Archimedes — a thin client over the public HTTP API, for agents that call tools instead of curl."
readme = "README.md"
requires-python = ">=3.10"
license = "Unlicense"
license-files = ["LICENSE"]
authors = [{ name = "Archimedes" }]
keywords = ["mcp", "model-context-protocol", "quantitative-finance", "agent", "rigor"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]

# Three dependencies, and each one is here for a reason worth writing down — same
# discipline as ./cli's pyproject, whose comment explains why an unwritten command's
# dependency is deliberately NOT listed.
#
#   mcp>=2.1              the official MCP Python SDK. Floor is 2.1 rather than open:
#                         `FastMCP` was renamed `MCPServer` in 2.0, so 1.x code does not
#                         import here and this code does not import there. A range, not a
#                         guess.
#   httpx>=0.27           the entire reach of this server. There is no DB driver, no redis
#                         client, no web3, and no `archimedes` backend import, and there is
#                         not meant to be: if a capability is not in the public HTTP API,
#                         this server does not have it.
#   archimedes-cli>=0.1.0 for `archimedes_cli.session.load_session` ONLY — the fallback
#                         credential is the cookie cache `archimedes login` writes, and
#                         reusing that loader by import is the only way the two clients
#                         cannot disagree about what a usable session is. It is a small
#                         dependency by construction (click + httpx).
#
# NOTE, honestly: `archimedes-cli` is not on PyPI (checked 2026-08-31 — HTTP 404), so
# `pip install archimedes-mcp` from an index cannot resolve today. Both distributions
# install from this repo: `pip install -e ./cli -e ./mcp-server`. Publishing the CLI is
# open decision D6 on #1653; writing an optional-and-vendored copy of the loader to dodge
# that would trade an honest packaging gap for a silent drift risk.
dependencies = [
  "mcp>=2.1",
  "httpx>=0.27",
  "archimedes-cli>=0.1.0",
]

[project.urls]
Homepage = "https://archimedes-arc.com"
Repository = "https://github.com/aprin-labs/archimedes"
Issues = "https://github.com/aprin-labs/archimedes/issues"

[project.scripts]
archimedes-mcp = "archimedes_mcp.server:main"

[dependency-groups]
dev = [
  "pytest>=8.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archimedes_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
