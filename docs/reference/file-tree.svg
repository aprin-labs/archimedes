<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1310" viewBox="0 0 1160 1310" role="img" aria-labelledby="ft-t ft-d">
<title id="ft-t">Archimedes repository map</title>
<desc id="ft-d">Top-level repository layout with the most load-bearing files, each annotated with its role.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}</style>
<rect x="0.5" y="0.5" width="1159" height="1309" rx="16" fill="#0B0C10" stroke="rgba(255,255,255,0.10)"/>
<text x="48" y="46" fill="#D4A853" font-size="11" letter-spacing="3" font-weight="600">ARCHIMEDES — REPOSITORY MAP</text>
<text x="48" y="78" fill="#FAFAFA" font-size="24" font-family="Georgia,serif">Where everything lives</text>
<text x="48" y="100" fill="#A1A1AA" font-size="11.5">Top-level layout + the ~25 most load-bearing files. Gold = directory · white = Python · blue = Solidity · green = UI.</text>
<rect x="700" y="40" width="9" height="9" rx="2" fill="#D4A853"/>
<text x="714" y="48" fill="#A1A1AA" font-size="9.5">backend</text>
<rect x="795" y="40" width="9" height="9" rx="2" fill="#60A5FA"/>
<text x="809" y="48" fill="#A1A1AA" font-size="9.5">contracts</text>
<rect x="908" y="40" width="9" height="9" rx="2" fill="#10B981"/>
<text x="922" y="48" fill="#A1A1AA" font-size="9.5">ui</text>
<rect x="958" y="40" width="9" height="9" rx="2" fill="#F59E0B"/>
<text x="972" y="48" fill="#A1A1AA" font-size="9.5">analytics</text>
<rect x="1071" y="40" width="9" height="9" rx="2" fill="#A78BFA"/>
<text x="1085" y="48" fill="#A1A1AA" font-size="9.5">infra / CI</text>
<text x="64" y="150" class="mono" font-size="12" fill="#3F3F46"><tspan fill="#D4A853" font-weight="600">archimedes/</tspan></text>
<text x="480" y="150" font-size="10.5" fill="#A1A1AA">the public repo — github.com/aprin-labs/archimedes</text>
<text x="64" y="174" class="mono" font-size="12" fill="#3F3F46">├─ <tspan fill="#D4A853" font-weight="600">backend/archimedes/</tspan></text>
<text x="480" y="174" font-size="10.5" fill="#A1A1AA">the Python monolith: API + agents + services + chain + marketplace</text>
<text x="64" y="198" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#FAFAFA">main.py</tspan></text>
<text x="480" y="198" font-size="10.5" fill="#A1A1AA">app boot: routers, /health honesty flags, corpus seed</text>
<text x="64" y="222" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#D4A853" font-weight="600">api/</tspan></text>
<text x="480" y="222" font-size="10.5" fill="#A1A1AA">FastAPI route layer</text>
<text x="64" y="246" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">auth_siwe.py</tspan></text>
<text x="480" y="246" font-size="10.5" fill="#A1A1AA">EIP-4361 wallet auth → session cookie (humans and agents)</text>
<text x="64" y="270" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">generate_routes.py</tspan></text>
<text x="480" y="270" font-size="10.5" fill="#A1A1AA">SSE strategy-generation jobs</text>
<text x="64" y="294" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">vaults_routes.py</tspan></text>
<text x="480" y="294" font-size="10.5" fill="#A1A1AA">vault create/list — ownership always ends with the user</text>
<text x="64" y="318" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">selection_bias_routes.py</tspan></text>
<text x="480" y="318" font-size="10.5" fill="#A1A1AA">the external rigor-gate API</text>
<text x="64" y="342" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">marketplace_routes.py</tspan></text>
<text x="480" y="342" font-size="10.5" fill="#A1A1AA">publish · subscribe · earnings withdraw</text>
<text x="64" y="366" class="mono" font-size="12" fill="#3F3F46">│  │  └─ <tspan fill="#FAFAFA">corpus_routes.py</tspan></text>
<text x="480" y="366" font-size="10.5" fill="#A1A1AA">real KB artifacts only — honest 503 until they exist</text>
<text x="64" y="390" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#D4A853" font-weight="600">agents/</tspan></text>
<text x="480" y="390" font-size="10.5" fill="#A1A1AA">generation</text>
<text x="64" y="414" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">generation_pipeline.py</tspan></text>
<text x="480" y="414" font-size="10.5" fill="#A1A1AA">SSE orchestrator — the debate society is the sole path</text>
<text x="64" y="438" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">debate_engine.py</tspan></text>
<text x="480" y="438" font-size="10.5" fill="#A1A1AA">proposers → critics → deterministic rigor → K=1 + rejects</text>
<text x="64" y="462" class="mono" font-size="12" fill="#3F3F46">│  │  └─ <tspan fill="#FAFAFA">strategy_fusion.py</tspan></text>
<text x="480" y="462" font-size="10.5" fill="#A1A1AA">multi-paper fusion proposer + candidate retrieval</text>
<text x="64" y="486" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#D4A853" font-weight="600">services/</tspan></text>
<text x="480" y="486" font-size="10.5" fill="#A1A1AA">~80 modules — the engine room; five that matter most:</text>
<text x="64" y="510" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">llm_backend.py</tspan></text>
<text x="480" y="510" font-size="10.5" fill="#A1A1AA">Bedrock Converse seam — Nova Micro · BYOK · local Ollama</text>
<text x="64" y="534" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">paper_rag.py</tspan></text>
<text x="480" y="534" font-size="10.5" fill="#A1A1AA">MiniLM semantic rerank (guardrails + TF-IDF fallback)</text>
<text x="64" y="558" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">live_rigor_gate.py</tspan></text>
<text x="480" y="558" font-size="10.5" fill="#A1A1AA">four-state pass / fail / pending / degenerate badge — live, never cached</text>
<text x="64" y="582" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">strategy_dsl.py</tspan></text>
<text x="480" y="582" font-size="10.5" fill="#A1A1AA">the persisted, executable strategy spec</text>
<text x="64" y="606" class="mono" font-size="12" fill="#3F3F46">│  │  └─ <tspan fill="#FAFAFA">runner_lease.py</tspan></text>
<text x="480" y="606" font-size="10.5" fill="#A1A1AA">exactly-once Redis leases for funds-adjacent runners</text>
<text x="64" y="630" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#D4A853" font-weight="600">chain/</tspan></text>
<text x="480" y="630" font-size="10.5" fill="#A1A1AA">on-chain integration</text>
<text x="64" y="654" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">executor.py</tspan></text>
<text x="480" y="654" font-size="10.5" fill="#A1A1AA">rebalance execution — Circle DCW signer preferred</text>
<text x="64" y="678" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">agent_runner.py</tspan></text>
<text x="480" y="678" font-size="10.5" fill="#A1A1AA">the vault tick loop: commit → trade → reveal</text>
<text x="64" y="702" class="mono" font-size="12" fill="#3F3F46">│  │  ├─ <tspan fill="#FAFAFA">oracle_runner.py</tspan></text>
<text x="480" y="702" font-size="10.5" fill="#A1A1AA">per-synth price pushes — lease-gated, fails closed</text>
<text x="64" y="726" class="mono" font-size="12" fill="#3F3F46">│  │  └─ <tspan fill="#FAFAFA">trace_publisher.py</tspan></text>
<text x="480" y="726" font-size="10.5" fill="#A1A1AA">ReasoningTraceRegistry commit/reveal client</text>
<text x="64" y="750" class="mono" font-size="12" fill="#3F3F46">│  └─ <tspan fill="#D4A853" font-weight="600">marketplace/</tspan></text>
<text x="480" y="750" font-size="10.5" fill="#A1A1AA">x402 nanopayment rail</text>
<text x="64" y="774" class="mono" font-size="12" fill="#3F3F46">│     ├─ <tspan fill="#FAFAFA">payments.py</tspan></text>
<text x="480" y="774" font-size="10.5" fill="#A1A1AA">402 → EIP-712 payment header → Circle Gateway settle</text>
<text x="64" y="798" class="mono" font-size="12" fill="#3F3F46">│     └─ <tspan fill="#FAFAFA">settlement.py</tspan></text>
<text x="480" y="798" font-size="10.5" fill="#A1A1AA">Gateway → wallet → PaymentSplitter sweep (dry-run guard)</text>
<text x="64" y="822" class="mono" font-size="12" fill="#3F3F46">├─ <tspan fill="#D4A853" font-weight="600">contracts/src/</tspan></text>
<text x="480" y="822" font-size="10.5" fill="#A1A1AA">Solidity (Foundry) · 13 sources · ABIs cached in contracts/abis/</text>
<text x="64" y="846" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#93C5FD">Vault.sol</tspan></text>
<text x="480" y="846" font-size="10.5" fill="#A1A1AA">non-custodial ERC-4626 — commit-before-trade enforced on-chain</text>
<text x="64" y="870" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#93C5FD">ReasoningTraceRegistry.sol</tspan></text>
<text x="480" y="870" font-size="10.5" fill="#A1A1AA">the commit/reveal provenance anchor</text>
<text x="64" y="894" class="mono" font-size="12" fill="#3F3F46">│  └─ <tspan fill="#93C5FD">PaymentSplitter.sol</tspan></text>
<text x="480" y="894" font-size="10.5" fill="#A1A1AA">90/10 creator/platform USDC split</text>
<text x="64" y="918" class="mono" font-size="12" fill="#3F3F46">├─ <tspan fill="#D4A853" font-weight="600">ui/src/</tspan></text>
<text x="480" y="918" font-size="10.5" fill="#A1A1AA">React 19 + Vite + viem SPA (plain-CSS design system)</text>
<text x="64" y="942" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#6EE7B7">App.jsx · Layout.jsx</tspan></text>
<text x="480" y="942" font-size="10.5" fill="#A1A1AA">routes + sidebar: Generate · Library · Portfolio · Marketplace …</text>
<text x="64" y="966" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#6EE7B7">components/Generate.jsx</tspan></text>
<text x="480" y="966" font-size="10.5" fill="#A1A1AA">the primary action: brief → debate stream → passport</text>
<text x="64" y="990" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#6EE7B7">components/CreateVaultModal.jsx</tspan></text>
<text x="480" y="990" font-size="10.5" fill="#A1A1AA">client-signed deploy: createVault → setAgent (you sign everything)</text>
<text x="64" y="1014" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#6EE7B7">components/Reasoning.jsx</tspan></text>
<text x="480" y="1014" font-size="10.5" fill="#A1A1AA">trace viewer — recompute hash vs the on-chain anchor</text>
<text x="64" y="1038" class="mono" font-size="12" fill="#3F3F46">│  └─ <tspan fill="#6EE7B7">config.js</tspan></text>
<text x="480" y="1038" font-size="10.5" fill="#A1A1AA">chain 5042002 + the T3.2 contract-address set (2026-07-09)</text>
<text x="64" y="1062" class="mono" font-size="12" fill="#3F3F46">├─ <tspan fill="#D4A853" font-weight="600">analytics-engine/</tspan></text>
<text x="480" y="1062" font-size="10.5" fill="#A1A1AA">backtrader backtest runner (own uv-managed env + tests)</text>
<text x="64" y="1086" class="mono" font-size="12" fill="#3F3F46">│  └─ <tspan fill="#D4A853" font-weight="600">strategies/</tspan></text>
<text x="480" y="1086" font-size="10.5" fill="#A1A1AA">34 paper-grounded reference strategies</text>
<text x="64" y="1110" class="mono" font-size="12" fill="#3F3F46">├─ <tspan fill="#D4A853" font-weight="600">infra/</tspan></text>
<text x="480" y="1110" font-size="10.5" fill="#A1A1AA">Terraform: ALB/WAF · Aurora · ElastiCache · ECR · ECS Fargate</text>
<text x="64" y="1134" class="mono" font-size="12" fill="#3F3F46">│  ├─ <tspan fill="#FAFAFA">ecs.tf</tspan></text>
<text x="480" y="1134" font-size="10.5" fill="#A1A1AA">the Fargate web tier + contract-address env (deploy SSOT)</text>
<text x="64" y="1158" class="mono" font-size="12" fill="#3F3F46">│  └─ <tspan fill="#D4A853" font-weight="600">runbooks/</tspan></text>
<text x="480" y="1158" font-size="10.5" fill="#A1A1AA">ecs-fargate-cutover.md — the executed cutover playbook</text>
<text x="64" y="1182" class="mono" font-size="12" fill="#3F3F46">├─ <tspan fill="#D4A853" font-weight="600">.github/workflows/</tspan></text>
<text x="480" y="1182" font-size="10.5" fill="#A1A1AA">deploy.yml: build-in-CI → ECR → migrate → Fargate redeploy</text>
<text x="64" y="1206" class="mono" font-size="12" fill="#3F3F46">├─ <tspan fill="#FAFAFA">docker-compose.yml</tspan></text>
<text x="480" y="1206" font-size="10.5" fill="#A1A1AA">local parity stack (localdb + runners profiles)</text>
<text x="64" y="1230" class="mono" font-size="12" fill="#3F3F46">└─ <tspan fill="#D4A853" font-weight="600">docs/</tspan></text>
<text x="480" y="1230" font-size="10.5" fill="#A1A1AA">living specs — user-stories.md is the canonical product spine</text>
