name: archimedes
channels:
  - conda-forge
dependencies:
  # Core toolchain
  - python=3.12
  - pip
  - uv          # Modern, fast Python package + tool installer (used for arc-canteen and dev tooling)
  - git
  - nodejs>=22  # Frontend toolchain (npm, npx). Required for `npm run lint`,
                # `npm run dev`, `npm run build` in ui/. Without this, devs
                # have to install Node separately and CI-vs-local parity
                # breaks (the ESLint gate runs in CI only).

  # Postgres client library — needed to BUILD, not just to run (issue #1632).
  # backend/requirements-base.txt now asks for source-built `psycopg2` instead
  # of `psycopg2-binary`, so pip compiles it during `conda env create` and needs
  # `pg_config` + the libpq headers on PATH. conda-forge's libpq supplies both,
  # and it is linked against the SAME conda-forge openssl as the env's Python —
  # so a dev machine gets the same one-OpenSSL-per-process property production
  # gets, which is the point of the swap. (A C compiler is also required:
  # Xcode Command Line Tools on macOS, build-essential on Linux. Deliberately
  # not pulled from conda-forge — `c-compiler` is a large download that tends to
  # fight the system toolchain, and every dev already has one.)
  #
  # This is a conda-level entry on purpose. It is a shared LIBRARY, not a pip
  # floor, so it is invisible to backend/tests/test_env_requirements_alignment.py
  # and creates no second home for a version (the psycopg2 floor still lives
  # only in backend/requirements-base.txt, which the pip block below includes).
  - libpq

  # Infra / cloud CLI tooling — conda-forge binaries, pinned so the whole team
  # (and a from-scratch setup) gets one consistent version for IaC + AWS work.
  - terraform>=1.10   # IaC for the AWS stack (infra/*.tf). >=1.10 required for S3-native
                      #   state locking (use_lockfile=true; see infra/README.md). Verified 1.15.3.
  - awscli>=2.15      # AWS CLI v2 (conda-forge ships v2). v2 is REQUIRED for `aws configure sso`
                      #   / IAM Identity Center — v1's SSO support is insufficient. Verified 2.34.48.
  # NOTE: aws-sam-cli is intentionally NOT here — it is not packaged on conda-forge.
  #   Install via Homebrew (`brew install aws-sam-cli`). See infra/README.md
  #   "Local CLI tooling" for when SAM actually applies (Lambda/serverless only).

  # Python deps installed via pip — pinned loosely; tighten in pyproject.toml as the project firms up.
  - pip:
      # --- Shared backend floors ---
      # Included, not restated. backend/requirements-base.txt owns the 33
      # floors that local dev and Docker/CI both need, so a Dependabot bump
      # lands in one file instead of being mirrored here by hand (issue #1522;
      # when the guard in #1493 landed, 18 of 34 shared floors had already
      # drifted, every one of them low). pip resolves this path relative to the
      # directory holding environment.yml, which is where `conda env create`
      # runs pip from.
      #
      # NOT included: the `--extra-index-url .../whl/cpu` + torch +
      # sentence-transformers block, which stays in backend/requirements.txt.
      # Pulling the CPU wheel index in here would install the CPU build on dev
      # machines and lose MPS on Apple Silicon. The native floors are restated
      # below instead, and backend/tests/test_env_requirements_alignment.py
      # holds them in lockstep with the deployed ones.
      - -r backend/requirements-base.txt

      # --- Plotting (environment.yml-only) ---
      # Exploratory/notebook use; no counterpart in backend/requirements.txt
      # because no backend runtime module imports either.
      - matplotlib>=3.8
      - seaborn>=0.13

      # --- Semantic retrieval (paper_rag MiniLM embeddings, issue #874) ---
      - torch>=2.13.0,<3.0             # PyTorch CPU (local dev: pip picks the native/MPS wheel; Docker uses the CPU-only wheel via --extra-index-url in requirements.txt). Floor aligned with backend/requirements.txt via dependabot PR #1163.
      - sentence-transformers>=6.0.1  # all-MiniLM-L6-v2 zero-cost semantic retrieval for paper_rag.py. Floor aligned with backend/requirements.txt via dependabot PR #1858 (6.0.0 -> 6.0.1, patch).

      # --- Quality + tests ---
      - ruff>=0.6                     # Linter + formatter; configured at line length 120
      - pytest>=8.3
      - pytest-asyncio>=0.24
      - pytest-cov>=5.0
      - "fakeredis[lua]>=2.26.0"         # Test double for Redis in marketplace unit tests (test_state.py); dev-only, not in prod requirements.txt
      - pathspec>=0.12                # gitignore-style matching, the library mkdocs compiles `exclude_docs`/`not_in_nav` with. Required by the docs publication guards (test_docs_default_deny.py, test_mkdocs_exclude_docs_matches.py) so they assert what the site build actually does; dev/test-only, not in prod requirements.txt. Mirrored in .github/workflows/quality-gate.yml's two pip install lines.
      - mypy>=1.11
      - "pip-audit>=2.7"              # Supply-chain CVE scanner — run `pip-audit` to check installed deps against the PyPI vulnerability DB. Not yet a CI gate; advisory only.

      # --- Dev convenience ---
      - ipython>=8.27
      - jupyter>=1.1                  # For exploratory strategy work
      - tornado>=6.5.7                # Pinned directly to close CVE-2026-49854 (WebSocket frame-length overflow) in jupyter's transitive tornado dep; floor raised to 6.5.7 (CVE bump 2026-06-25). environment.yml-only: tornado is a dev/notebook dependency, not imported by backend runtime code (not in backend/requirements.txt).
