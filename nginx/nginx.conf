# ── nginx server fragment ──────────────────────────────────────────────
# This file is mounted at /etc/nginx/conf.d/default.conf (see nginx/Dockerfile)
# and is therefore included INSIDE the stock nginx `http {}` block. That is why
# the http-context directives below (map / upstream / limit_req_zone / gzip)
# are valid here — they are not at the true top level, they are inside `http {}`
# via the conf.d include. Validate with `nginx -t` by mounting this file into
# conf.d (NOT as the main nginx.conf):
#   docker run --rm \
#     -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
#     nginxinc/nginx-unprivileged:alpine nginx -t

# ── Real client IP behind the ALB ──────────────────────────────────────
# Trust X-Forwarded-For only from the ALB VPC (10.0.0.0/16) — restricts
# real-IP trust to the known ALB subnet after the EC2 SG was locked to this
# CIDR. Previously trusted all three RFC1918 ranges including 172.16.0.0/12
# (which covers 172.31.0.0/16, the EC2's own default VPC), allowing the EC2
# itself to spoof client IPs and bypass rate-limit buckets. (AUDIT I7)
set_real_ip_from 10.0.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# ── Backend upstream ───────────────────────────────────────────────────
# Single source of truth for the FastAPI backend address. keepalive reuses
# upstream connections, cutting per-request TCP/handshake overhead between
# nginx and the backend.
#
# RUNTIME DNS RE-RESOLUTION (fix for the recreate-502): with a plain
# `server backend:8000;` nginx resolves the `backend` hostname to an IP ONCE at
# config-load and caches it for the worker's lifetime. When `docker compose up
# -d --force-recreate backend` (or a partial recreate) gives the backend a NEW
# container IP, nginx keeps proxying to the dead IP and every request 502s until
# nginx is restarted. The `resolver` (docker's embedded DNS at 127.0.0.11) plus
# `zone` + the `resolve` parameter make nginx re-resolve `backend` periodically
# (valid=10s) at RUNTIME, so a backend recreate self-heals without an nginx
# restart. Requires nginx ≥ 1.27.3 for open-source upstream `resolve`; the image
# is pinned to 1.31.2 (nginx/Dockerfile) to match the live box. keepalive is preserved.
# Upstream + resolver are ENV-DRIVEN (rendered by the nginx image's built-in
# envsubst-on-templates entrypoint) so ONE config serves both runtimes:
#   • docker-compose / local: Docker's embedded DNS resolves the `backend`
#     service name — NGINX_RESOLVER_LINE="resolver 127.0.0.11 …",
#     NGINX_BACKEND_UPSTREAM="backend:8000", NGINX_UPSTREAM_RESOLVE="resolve".
#   • Fargate (awsvpc): the two containers share the task's network namespace
#     (localhost), and there is NO Docker DNS at 127.0.0.11 — so the resolver
#     line is empty, NGINX_BACKEND_UPSTREAM="127.0.0.1:8000", RESOLVE empty.
# Values set per-env in docker-compose.yml, infra/ecs.tf, and deploy.yml's
# nginx-validate step. (Fixes the awsvpc 502-on-/health the red-team flagged.)
${NGINX_RESOLVER_LINE}
upstream backend_api {
    zone backend_api 64k;
    server ${NGINX_BACKEND_UPSTREAM} ${NGINX_UPSTREAM_RESOLVE};
    keepalive 32;
}

upstream auth_service {
    zone auth_service 64k;
    server ${NGINX_AUTH_UPSTREAM} ${NGINX_UPSTREAM_RESOLVE};
    keepalive 16;
}

# ── Per-path CSP (http-context map, valid here per the header note) ────
# FastAPI's Swagger UI (/docs) loads swagger-ui-bundle.js + swagger-ui.css
# from jsDelivr; the app CSP's `script-src 'self'` blocks the script and the
# page renders BLANK (openapi.json still shows — it carries no scripts).
# Scope the CDN allowance to the docs page alone instead of weakening the
# app: a map keyed on $uri picks the policy and the single server-level
# add_header below emits it — deliberately NOT a per-location add_header,
# which would silently drop every other inherited security header (nginx
# add_header inheritance replaces, never merges). Prod serves 404 on /docs
# anyway (main.py's PUBLIC_DOMAIN gate), so this allowance is effectively a
# local-dev/ENABLE_API_DOCS affordance; the app surface keeps the strict CSP.
map $uri $csp_policy {
    default "default-src 'self'; script-src 'self' 'sha256-ASECgocBcGWh7BG/yec7jR6PLvDGDA9r96mYGyxhh/A='; connect-src 'self' https://rpc.testnet.arc.network https://testnet.arcscan.app https://*.coingecko.com https://*.alchemyapi.io https://api.z.ai https://api.anthropic.com https://modular-sdk.circle.com wss://*; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; font-src 'self' data:;";
    "~^/docs" "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; font-src 'self' data:;";
}

# ── TLS terminates UPSTREAM (CloudFront + ALB), not here ───────────────
# The edge chain is: client → CloudFront (HTTPS, ACM cert) → ALB (HTTPS:443,
# ACM cert) → EC2:80 → nginx:8080 over PLAIN HTTP. nginx therefore terminates
# nothing and performs no HTTP→HTTPS redirect — CloudFront's viewer-protocol
# policy already upgrades http→https at the edge, and a redirect here would
# loop. The previous design ran an in-container self-signed cert on a :8443
# listener and had the ALB target group speak HTTPS to it; that stopgap choked
# CloudFront→ALB→nginx on large responses (the ~1.5 MB JS bundle 502'd while
# small paths like / and /health returned 200). Serving plain HTTP on :8080 and
# pointing the ALB target group at HTTP removes the self-signed hop entirely.

# ── Compression ────────────────────────────────────────────────────────
# gzip JSON API responses + text assets to save user bandwidth. SSE is
# explicitly excluded per-location (gzip off there) so streamed events are
# not buffered for compression. gzip_proxied any → compress even when the
# response carries a Via header (i.e. proxied from the backend / behind ALB).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    application/json
    application/javascript
    application/manifest+json
    application/xml
    application/rss+xml
    image/svg+xml
    text/css
    text/javascript
    text/plain
    text/xml;

# ── Trust the upstream X-Forwarded-Proto (CloudFront/ALB), don't overwrite it ──
# The edge chain is client --https--> CloudFront --> ALB --> nginx. The ALB
# sets X-Forwarded-Proto: https on every request it forwards (it always
# terminates TLS at :443 here — see alb.tf), but nginx's own $scheme is
# "http" (nginx never terminates TLS — see the "TLS terminates UPSTREAM"
# note above). Blindly doing `proxy_set_header X-Forwarded-Proto $scheme;`
# DISCARDS the real ALB-supplied value and replaces it with "http", so
# uvicorn (run with --proxy-headers --forwarded-allow-ips=*) believes every
# request is plain HTTP and emits redirects with an http:// Location — which
# a browser blocks as mixed content on any fetch/XHR from the https page
# (proven live: `curl -sSD - https://archimedes-arc.com/api/strategies`
# returned a 307 to `http://archimedes-arc.com/api/strategies/`). This map
# passes the inbound header through when present and only falls back to
# $scheme (matching nginx's own convention) when it's genuinely absent —
# e.g. someone hits nginx directly, bypassing CloudFront/ALB. Must live in
# the http{} context (this file is included via conf.d, which IS http{} —
# see the file-level note at the top), not inside server{}.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# ── Rate limiting zones (defense-in-depth behind slowapi) ──────────────
# These fire even if an attacker somehow bypasses the app-layer rate limiter.
# After the real_ip directives above, $binary_remote_addr is the real client
# IP, so each client gets its own bucket. These are a defense-in-depth BACKSTOP
# above the app-layer slowapi limits — they must stay HIGHER than the per-route
# app limits so nginx never becomes the binding constraint on legitimate SPA
# traffic (the UI polls several endpoints on 2-5s intervals; 60r/m leaves ~2x
# headroom over the app-layer public-GET limit, 30r/m did not — it 503'd normal
# usage). 60/min reads, 20/min writes.
limit_req_zone $binary_remote_addr zone=api_read:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=api_write:10m rate=20r/m;

# ── DRY proxy parameters ───────────────────────────────────────────────
# The repeated proxy headers/timeouts that previously lived in every
# `location` block are declared ONCE at the server level below and inherited
# by all proxy locations. The SSE location overrides only what it must (read
# timeout + buffering). This is the DRY win: one place to change a header,
# applied everywhere.

# ── Extra MIME type: .webmanifest (#1380) ──────────────────────────────
# Stock nginx `mime.types` (included by the base image's own /etc/nginx/nginx.conf
# before this conf.d fragment is spliced in) has no `.webmanifest` entry, so a
# `site.webmanifest` served from the static root fell back to `default_type`
# (application/octet-stream) — out of spec vs. the manifest RFC's
# `application/manifest+json` and enough for some PWA install heuristics to balk.
# MUST live here, at this file's top level (http context, via the conf.d splice —
# see the file-header comment), NOT nested inside `server {}` below. A `types {}`
# block does not merge into an ancestor context's type map — it replaces it
# outright for whatever context declares it. Declared inside `server {}` this
# block would wholesale-blank every other extension's content type for that
# server (.css/.js/.html all falling back to octet-stream too) — verified live
# with this exact snippet moved into `server {}`. Declared here, at the same
# http-context level where the base image's `include mime.types;` already ran,
# it appends to that existing map instead: a genuinely additive override.
types { application/manifest+json webmanifest; }

server {
    listen 8080;
    server_name archimedes-arc.com;

    # ── Shared proxy parameters (inherited by every proxy location) ───────
    # Defining these at server level removes the per-location duplication
    # (DRY): each `location` that proxy_passes inherits these unless it
    # overrides them. Timeouts are the read/write defaults; the SSE location
    # overrides proxy_read_timeout + buffering for streaming.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # X-Client-IP carries the SAME realip-resolved $remote_addr as X-Real-IP
    # above, under a name the auth service owns (#1691). Better Auth keys every
    # rate-limit bucket on `${ip}|${path}` and resolves that ip from the headers
    # named in `advanced.ipAddress.ipAddressHeaders` — auth/auth.js sets exactly
    # ['x-client-ip'], so this line is the whole supply. Reading X-Forwarded-For
    # instead cannot work: the header is multi-valued here (CloudFront sets the
    # viewer, the ALB appends the edge it saw, `$proxy_add_x_forwarded_for`
    # below appends nginx's own peer), and Better Auth refuses a multi-hop
    # header outright rather than trust a spoofable token
    # (@better-auth/core/dist/utils/ip.mjs:189) — which collapsed every caller
    # in the world into one shared bucket per path.
    #
    # WHY THIS IS NOT SPOOFABLE: `proxy_set_header` SETS, it does not append, so
    # a client-supplied `X-Client-IP: 1.2.3.4` is overwritten before the request
    # leaves nginx. $remote_addr itself is either the socket peer or — only when
    # that peer is inside the `set_real_ip_from 10.0.0.0/16` ALB CIDR above — the
    # realip module's resolution of X-Forwarded-For. A request from anywhere
    # outside that CIDR therefore contributes nothing to the value it is keyed
    # on. Identical reasoning, and the identical value, to the two limiters that
    # already depend on X-Real-IP: backend/archimedes/api/limiter.py and
    # services/generation_quota.py ("never trust X-Forwarded-For").
    #
    # SCOPE, stated exactly: with only the ALB CIDR trusted and
    # `real_ip_recursive on`, this resolves to the RIGHTMOST forwarded address
    # outside 10.0.0.0/16 — behind CloudFront that is the CloudFront edge that
    # relayed the request, not the viewer. Buckets are therefore per-edge, not
    # per-viewer: unspoofable and no longer global, but coarser than one caller.
    # Sharpening it further means trusting CloudFront's published edge ranges
    # here, which is deliberately NOT done — that list changes, and a stale one
    # degrades silently. Layers 2 and 3 have always keyed on this same value.
    proxy_set_header X-Client-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    proxy_send_timeout 10s;

    # ── Security headers ──────────────────────────────────────────────────
    # Production traffic is served from this block (CloudFront + ALB terminate
    # TLS and forward to :8080 as HTTP), so the headers must live here. The
    # `always` flag ensures they are emitted on error responses (4xx/5xx) too,
    # not just 2xx/3xx. script-src permits self-hosted bundles plus one exact
    # SHA-256 hash for the inline pre-paint theme bootstrap. This avoids a theme
    # flash without admitting arbitrary inline scripts. The bundle has no
    # executed eval; remaining Function() constructors are dead fallback paths.
    # style-src
    # 'unsafe-inline' is retained deliberately (separate concern). HSTS is still
    # emitted here so it reaches the browser through the TLS edge.
    # Emit nginx-generated redirects (the @sign_in 302, directory-slash
    # redirects) with RELATIVE Location headers. Without this, nginx
    # absolutizes them using the LISTEN port (port_in_redirect defaults on):
    # listening on 8080 behind a host publish of :80, an anonymous /app/generate
    # visit 302'd to http://localhost:8080/sign-in — unreachable ("Failed to
    # open page"; found dogfooding 2026-08-20). Relative Locations resolve
    # against whatever origin the client actually used — correct on any
    # published port locally AND scheme-safe behind the CloudFront/ALB TLS
    # edge (an absolute http:// Location on an https origin is the same
    # family as the X-Forwarded-Proto 307 bug documented above).
    absolute_redirect off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # Circle Modular Wallets SDK calls https://modular-sdk.circle.com for passkey
    # register/login + bundler RPC. Chrome strictly enforces connect-src; without
    # this entry, the SDK fails with "An unknown RPC error occurred. Details:
    # Failed to fetch" on every passkey signup. Safari is more lenient and worked
    # before this entry was added, which is why the regression was Chrome-only.
    # Value selected per-path by the $csp_policy map above (docs-only CDN
    # allowance for Swagger UI; strict everywhere else).
    add_header Content-Security-Policy $csp_policy always;

    # ACME challenge passthrough for certbot renewals
    location /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    # SPA + static assets. TLS terminates upstream at CloudFront + the ALB; this
    # block serves over plain HTTP and performs NO redirect (that is CloudFront's
    # viewer-protocol-policy job — redirecting here would loop).
    #
    # gzip is OFF here on purpose. CloudFront (Compress: true) is the single
    # compressor for static assets. When nginx ALSO gzipped them, it emitted the
    # response as `Content-Encoding: gzip` with CHUNKED transfer (no
    # Content-Length, because gzip is streamed). CloudFront tolerates that for
    # tiny objects (index.html) but returns 502 "Error from cloudfront" on a
    # large chunked-gzip origin response (the ~1.5 MB JS bundle → ~446 KB
    # gzipped). Serving the asset uncompressed from disk gives it a
    # Content-Length via sendfile, and CloudFront compresses it at the edge —
    # single compression, no 502. (Proxied /api/ JSON keeps the server-level
    # gzip; only this static block opts out.)
    location = /_auth_session {
        internal;
        proxy_pass http://auth_service/_internal/auth/session;
        proxy_method GET;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location @sign_in {
        # Keep deep-link query args as top-level auth args; AuthPage safely
        # rebuilds and validates local /app destination after login.
        # Session-dependent: CloudFront's html cache policy keys WITHOUT cookies and
        # caches for 60s, so without this an anonymous visitor's 302 was replayed to
        # the next signed-in request and the SPA ping-ponged sign-in <-> /app
        # (2026-09-01 sign-in outage). Origin no-store wins over the policy TTL.
        add_header Cache-Control "private, no-store" always;
        return 302 /sign-in?next=$uri&$args;
    }

    # Anonymous-browse carve-outs (#1753, the owner's product call
    # narrowing #1194 revision d): Explore and Corpus are the ONLY login-free
    # pages under /app. Library, the leaderboard and the strategy passport are
    # gated — they fall through to the ^~ /app block below and answer an
    # anonymous request with the same @sign_in 302 (next= preserved) that any
    # other gated /app path gets. #1194 rev d also carved out
    # /app/leaderboard and /app/strategy; both carve-outs were REMOVED here,
    # deliberately, and re-adding either re-opens a page the owner gated.
    #
    # nginx picks the LONGEST matching prefix, so these win over the gated
    # ^~ /app block below. Must stay in lockstep with ANON_APP_PAGES in
    # ui/src/routes.js (the client half of the same split): a page listed in
    # one place but not the other either bounces a public page to sign-in or
    # serves a gated shell the SPA then refuses to render. That lockstep is
    # no longer only a comment — backend/tests/test_nginx_anonymous_carve_outs.py
    # derives the expected location set from ANON_APP_PAGES and fails on any
    # ungated /app location this list does not name.
    location = /app {
        # Bare /app is the SPA's alias for Explore — public with it.
        gzip off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location ^~ /app/explore {
        gzip off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
    location ^~ /app/corpus {
        gzip off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # /app/insights is NOT an anonymous-browse page (it is not, and must not
    # be added to, ANON_APP_PAGES/ROUTER's ANON set in ui/src/routes.js) — it
    # is the owner's admin-only traction dashboard (PR #1437, owner directive
    # 2026-08-20, supersedes #1028 D8). It is listed here, immediately above
    # the gated catch-all, ONLY so a reader auditing the carve-out list
    # top-to-bottom sees explicitly that insights is not one of them. It is
    # gated exactly like every other /app path.
    #
    # An earlier revision of this PR did the opposite — an ungated
    # `^~ /app/insights` carve-out serving the shell to every visitor — on
    # the theory that a 302 to /sign-in?next=/app/insights would confirm a
    # privileged page exists there. That reasoning was backwards, and the
    # carve-out was the leak (#1437 review, 2026-08-30):
    #
    #   ungated: anonymous GET /app/insights -> 200 HTML
    #            anonymous GET /app/library  -> 302 /sign-in
    #            anonymous GET /app/nonsense -> 302 /sign-in
    #
    # The 200 was an existence oracle readable before a single line of client
    # JS runs. Gated, all three return the identical 302 — the gated `^~ /app`
    # block below is a catch-all prefix with a SPA fallback, so nginx answers
    # a request for an UNKNOWN /app path exactly as it answers this one. The
    # redirect therefore distinguishes nothing; it is the uniform answer for
    # the whole /app namespace.
    #
    # `location = ` (exact match) not `^~ ` (prefix): a prefix would also
    # capture /app/insightsfoo and /app/insights-anything. Those fall through
    # to `^~ /app` below and are gated identically, so nothing is lost —
    # exact match just keeps this block's scope equal to its stated subject.
    #
    # This is only the pre-auth boundary. Real authorization is still
    # server-side `require_platform_admin` inside
    # `GET /api/metrics/private/whoami`, which App.jsx's fetchAdminProbe()
    # calls on entry: an authenticated NON-admin gets the shell here (as they
    # would for any unknown /app path) and then the same NotFound component an
    # unrouted path renders. App.jsx's insights-specific bypass of the
    # anonymous sign-in redirect is still live and still load-bearing — it
    # covers client-side navigation onto /app/insights, which never reaches
    # nginx at all.
    location = /app/insights {
        auth_request /_auth_session;
        # Session-dependent: CloudFront's html cache policy keys WITHOUT cookies and
        # caches for 60s, so without this an anonymous visitor's 302 was replayed to
        # the next signed-in request and the SPA ping-ponged sign-in <-> /app
        # (2026-09-01 sign-in outage). Origin no-store wins over the policy TTL.
        add_header Cache-Control "private, no-store" always;
        error_page 401 = @sign_in;
        gzip off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Server-side boundary prevents protected SPA HTML from being served
    # without a valid Better Auth session. FastAPI repeats authorization for APIs.
    location ^~ /app {
        auth_request /_auth_session;
        # Session-dependent: CloudFront's html cache policy keys WITHOUT cookies and
        # caches for 60s, so without this an anonymous visitor's 302 was replayed to
        # the next signed-in request and the SPA ping-ponged sign-in <-> /app
        # (2026-09-01 sign-in outage). Origin no-store wins over the policy TTL.
        add_header Cache-Control "private, no-store" always;
        error_page 401 = @sign_in;
        gzip off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        gzip off;
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Better Auth owns only its namespace; it never proxies through FastAPI.
    location /api/auth/ {
        limit_req zone=api_write burst=10 nodelay;
        proxy_pass http://auth_service/api/auth/;
    }

    # Proxy API requests to the FastAPI backend (proxy headers/timeouts
    # inherited from server level above — DRY).
    location /api/ {
        limit_req zone=api_read burst=20 nodelay;
        proxy_pass http://backend_api/api/;
    }

    # SSE streaming needs longer timeouts and must NOT be buffered or gzipped.
    location /api/generate/stream/ {
        limit_req zone=api_read burst=5 nodelay;
        proxy_pass http://backend_api/api/generate/stream/;
        # Override the server-level read timeout for long-lived streams.
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    # Proxy backend health check
    location /health {
        proxy_pass http://backend_api/health;
    }

    # Container-local health check for the ECS Docker healthCheck on the
    # nginx container itself (infra/ecs.tf). Deliberately does NOT proxy
    # anywhere: backend's /health does real work on every hit (Arc RPC +
    # DB + Redis — see backend/archimedes/main.py) and is the same endpoint
    # named as the OOM crash-loop cause (mode 2, #1328/#1329/#1337), so a
    # frequent container-level poller must not round-trip into it. This
    # location answers 200 directly from nginx once it is listening with a
    # validly-rendered config (envsubst + `nginx -t` passed) — zero added
    # backend load, whatever the poll interval. It intentionally does NOT
    # prove nginx can reach backend/auth; the proxied /health above and the
    # ALB's own target-group check (alb.tf) cover that.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Backend has no host port: docs must use the same nginx ingress. FastAPI
    # disables both routes in production unless ENABLE_API_DOCS explicitly opts in.
    location ^~ /docs {
        limit_req zone=api_read burst=5 nodelay;
        proxy_pass http://backend_api;
    }

    location = /openapi.json {
        limit_req zone=api_read burst=5 nodelay;
        proxy_pass http://backend_api/openapi.json;
    }
}
